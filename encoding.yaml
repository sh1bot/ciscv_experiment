# Structured source of truth for the pairing packet encoding.
# Render back to markdown with:  python3 util/encoding_render.py
#
# Every data row describes the seven variable columns h..rd; the renderer
# appends the invariant "opcode5 │1 0" tail (5-bit opcode + 2-bit marker "10",
# shown as bits). A cell may span N columns with a "*N" suffix (e.g.
# "imma[5:0]*2" spans g+rs2). Each field's ASCII box is width = 2*bits - 1, so
# individual bits align uniformly; bit widths below are the real encoding sizes
# and sum to 32 including opcode5(5)+marker(2). (funct3's box, 5 cols, can't
# hold the label, so it renders as "fn3".)
#
# A frame's `ops` is a list of {a: [...], b: [...]} clusters (bicliques). The
# allowed (opA, opB) pairs are the union of each cluster's a×b cross-product,
# and the opcode demand is the sum of the cluster products (clusters are
# disjoint). A cross-product frame is one cluster; a tuple-wise constraint is
# several; a shared-opcode frame (both slots identical) is a list of singleton
# {a: [x], b: [x]} clusters.
#
# ORDER-INSENSITIVE frames: when the two slots hold independent operations,
# (x, y) and (y, x) compute the same thing, so only one of them needs a
# codepoint. Such a frame must be written LONGHAND as a triangle over a stated
# canonical order — {a:[x], b:[x,y,z]}, {a:[y], b:[y,z]}, {a:[z], b:[z]} — and
# the scheduler normalises each pair into that order before encoding. Writing
# the full cross product instead costs n² codepoints to express n(n+1)/2
# distinct packets, very nearly double. There is deliberately no `unordered:`
# shorthand: the triangle states the canonical order explicitly, which the
# encoder needs anyway, and it keeps the codepoint count a plain sum of cluster
# products with no special case in the tooling.
#
# KNOWN GAP — the same-op diagonal. The triangle orders the OPCODES, but has no
# syntax to order two immediates of the SAME opcode. When an op has ext > 0 it
# occupies several codepoints (one per range band), and its diagonal cell pays
# w×w where w(w+1)/2 would do: the (narrow, wide) and (wide, narrow) spellings
# of one op-pair are both encoded when a tie-breaker on the range band would
# need only one. The waste is w(w-1)/2 per such op — 1 codepoint at ext=1, 6 at
# ext=2 — and it is zero for every op at the base range.
#
# This is a DON'T-CARE while the frame's count sits inside its block: blocks are
# powers of two, so a frame at 11 and a frame at 10 reserve the same 16 and the
# waste costs nothing real. It only becomes a decision if the waste is what
# pushes a count across a power-of-two boundary and doubles the reservation.
# dual-indep-pair pays 1 codepoint of it today, at 11 of 16 — five to spare
# before it would matter.
#
# Ordering the two immediates by VALUE (not just by range band) would be more
# efficient still — a strict ordering makes one of each equal-size pair
# redundant — but the decoder would have to compare the two immediates and
# conditionally swap them before use. Deliberately not pursued: the coding gain
# is small and the decode cost is not.
#
# A frame's optional `budget` is a sanity check on its codepoint count (see
# `python3 util/encoding_render.py --opcodes`): the count must land in
# (budget/2, budget]. Over the budget means too many ops for the allotted
# block; under half means the table is not yet filled in (or the budget is too
# large). Usually a power of two — the size of the prefix-code block the frame
# is allocated.

grid:
  columns:     [h, funct5, g, rs2, rs1, funct3, rd]
  display:     [1, 9,      1, 9,   9,   5,      9]
  bits:        [1, 5,      1, 5,   5,   3,      5]   # + opcode5(5) + marker(2) = 32

# Named opcode sets, referenced from frame `ops` via YAML aliases (*name).
# Kept here so the large recurring lists are written once.
opsets:
  # The RSD set, shared by rsd-alu-pair and arith-jump-pair. Both slots write
  # `alu rsd, rsd, ...` -- rd and rs1 are the SAME field -- so li (rs1=x0) is
  # NOT reachable by register choice the way it is in a chain slot, and needs
  # its own codepoint. It is also the single most common op in either frame
  # (3316 of 5934 slot uses), which is why it earns the wide field.
  #
  # Chosen by the same search used for chain_alu: the two rules widened to a
  # generous op set with unrestricted immediates, the REAL checks run over the
  # corpus, then a knapsack over the pairs that came back. Priced W^2 + 4W --
  # rsd-alu-pair is a full cross product (W x W = 256) and arith-jump-pair is
  # the set against 4 jump ops (W x 4 = 64) -- so W=16 is exactly the 320
  # codepoints the two frames already reserve.
  #
  # Width beats breadth decisively here, and it is addi that wants it: 36% of
  # addi_rsd sites sit at exactly 6 bits (|imm| 32..63, the stack-adjust and
  # loop-stride population), so a 5-bit field lands just under the mass and
  # cuts the frame in half. An all-5-bit set with 16 opcodes scores 1871
  # against this set's 4273; thirteen extra opcodes recover ~90 pairs while
  # narrowing addi costs ~1700. Above 7 bits it is flat (8b buys 22 pairs for
  # four fewer opcodes), so 7 is the knee.
  rsd_alu:  &rsd_alu
    - {op: addi, imm: {bits: 7, signed: true}}    # 4 codepoints; the RSD form
    - {op: li,   imm: {bits: 7, signed: true}}    # 4 codepoints; rd != rs1
    - add
    - {op: addiw, imm: {bits: 5, signed: true}}
    - and
    - {op: andi,  imm: {bits: 5, signed: true}}
    - or
    - {op: slli,  imm: {bits: 5, signed: false}}
    - {op: srli,  imm: {bits: 5, signed: false}}
    - xor

  # Same ops for arith-jump-pair, but addi/li capped at the 5 bits its row
  # actually draws: that frame spends its rd column on a sentinel, leaving only
  # `imma[4:0]`. Worth 414 candidate pairs if the row is ever widened -- see the
  # frame's notes. W=10, so 10 x 4 = 40 codepoints inside a budget of 64.
  rsd_alu_j: &rsd_alu_j
    - {op: addi, imm: {bits: 5, signed: true}}
    - {op: li,   imm: {bits: 5, signed: true}}
    - add
    - {op: addiw, imm: {bits: 5, signed: true}}
    - and
    - {op: andi,  imm: {bits: 5, signed: true}}
    - or
    - {op: slli,  imm: {bits: 5, signed: false}}
    - {op: srli,  imm: {bits: 5, signed: false}}
    - xor

  # The ALU set shared by the three CHAIN frames (chain-alu-pair,
  # load-chain-alu-pair, store-chain-alu-pair). Deliberately NOT *rsd_alu:
  # chain and rsd serve near-disjoint populations (ACCOUNTING.md §5), and a
  # chain slot is written `alu tmp, rs1a, ...` / `alu rdb, tmp, ...` with rs1
  # as an ENCODED FIELD -- so li (rs1=x0), mv (imm=0) and addi4spn (rs1=sp) are
  # all reached by choosing registers, not opcodes, and collapse into the one
  # `addi` codepoint. (rsd-alu-pair cannot do that: there rd and rs1 are the
  # same field, so li is unreachable and needs its own opcode -- see the
  # *rsd_alu note above, which is optimised separately over its own population.)
  #
  # Chosen by biclique search over the three chain populations jointly, priced
  # in codepoints: W=16 -> 16x16 + 4x16 + 16x2 = 256 + 64 + 32, exactly the
  # blocks already reserved.
  #
  # The search runs over pairs rules.py ACTUALLY accepts -- the rule widened to
  # a generous op set and an unrestricted immediate, then the real checks run
  # over the corpus. An earlier attempt optimised a structural population (any
  # ALU op in a chain position) and cost 93 pairs: it ignored the register
  # window, no_escape and commutative fitting, so its gains landed on pairs
  # rules.py rejects anyway while its losses landed on pairs it was accepting.
  #
  # Only addi earns extra range (7-bit, 4 codepoints) -- it carries li/mv, so it
  # is where the wide constants are. Spending 8 codepoints on an 8-bit addi, as
  # the first attempt did, buys almost nothing and starves the op list.
  # Re-optimised after const-store-pair was carved out: that frame drains the
  # `li tmp, K` + store cases from store-chain (869 -> 295 pairs), which were
  # what justified a 7-bit addi. 6 bits now suffice, freeing 2 slots for two
  # more opcodes. Capture over the three chain populations 578 -> 639.
  chain_alu: &chain_alu
    - {op: addi, imm: {bits: 6, signed: true}}     # 2 codepoints; carries li/mv
    - add
    - addw
    - and
    - andi
    - maxu
    - or
    - slli
    - sltiu
    - sltu
    - srli
    - srliw
    - sub
    - xor
    - xori
  loads:    &loads    [lb, lbu, lh, lhu, lw, lwu, ld]
  branches: &branches [beq, bne, blt, bge, bltu, bgeu]
  mem:      &mem      [lb, lbu, lh, lhu, lw, lwu, ld, sb, sh, sw, sd]

  # Width-annotated ops: a bare mnemonic takes the frame's base immediate range;
  # these request an explicit wider range, and each bit of range above the base
  # doubles that op's opcode-codepoint footprint (an extended-range op costs 2
  # codepoints, one bit wider again costs 4, ...). On RV64 the shift amount is
  # 6-bit; these addi-family entries carry a 6-bit signed immediate.
  slli_6u:  &slli_6u  {op: slli,  imm: {bits: 6, signed: false}}
  srli_6u:  &srli_6u  {op: srli,  imm: {bits: 6, signed: false}}
  addi_6s:  &addi_6s  {op: addi,  imm: {bits: 6, signed: true}}
  addiw_6s: &addiw_6s {op: addiw, imm: {bits: 6, signed: true}}
  li_6s:    &li_6s    {op: li,    imm: {bits: 6, signed: true}}

  # addi4spn carries its scale in its name: the offset is always a multiple of
  # 4, so the low two bits are structurally zero and encoding them is waste.
  # The field is UNSIGNED because storage below sp is not safe to address --
  # an interrupt may clobber it -- so a negative offset is not a thing this op
  # ever legitimately has. Both are intrinsic properties of the opcode, but
  # addi4spn is named only in `ops` and never spelled out in a template line,
  # so there is no template coefficient to carry them; they are declared here
  # instead. Measured on the corpus: zero genuine addi4spn are negative, and
  # 99.6% are 4-aligned, so x4 costs nothing and buys ~2 bits of reach.
  # (Scale 8 reaches further still but strands the 4.5% that are 4- but not
  # 8-aligned, and over-fits godot's 64-bit pointers; 32-bit targets are the
  # ones that most need the compression, so x4 it is.)
  addi4spn_u6: &addi4spn_u6 {op: addi4spn, imm: {bits: 6, signed: false, scale: 4}}

# Equivalencies: surface forms the scheduler should accept as matching a frame
# because they are equivalent to the canonical form the packet encodes. Each
# entry pairs a `canonical` form (how the frame is written) with a `spelled`
# surface form seen in code; matching normalises spelled -> canonical. A guard
# on an immediate uses a named class that also binds a parameter n:
#     single_bit = 1<<n      low_mask = 2^n - 1      high_mask = -(2^n)
# `bind` then derives the canonical operands (e.g. a shift amount) from n.
# `tmp` is the dead intermediate — it matches only tmp, so a value-changing
# rewrite is licensed structurally, with no separate liveness test. Commutative
# operand swap is NOT here: the scheduler owns that.
#
# STARTING POINT for iteration — nothing consumes this yet. Mirrors the
# equivalencies rules.py currently codifies implicitly (see yaml_migration.md).
equivalences:
  - name: low-mask-zero-test           # E1: test the low n bits are zero
    canonical: ["slli tmp, rs, s", "beqz/bnez tmp, L"]
    spelled:   ["andi tmp, rs, m", "beqz/bnez tmp, L"]
    when: {m: low_mask}                # m == 2^n - 1
    bind: {s: XLEN - n}

  - name: high-mask-zero-test          # E2: test the high bits are zero
    canonical: ["srli tmp, rs, n", "beqz/bnez tmp, L"]
    spelled:   ["andi tmp, rs, m", "beqz/bnez tmp, L"]
    when: {m: high_mask}               # m == -(2^n)
    bind: {n: n}

  - name: zero-compare-eq              # E3: beq/bne against x0 is the zero test
    canonical: ["beqz rd, L"]
    spelled:   ["beq rd, zero, L"]
  - name: zero-compare-ne
    canonical: ["bnez rd, L"]
    spelled:   ["bne rd, zero, L"]

  - name: single-bit-sign-test         # candidate extension (not in rules.py):
    canonical: ["slli tmp, rs, s", "blt tmp, zero, L"]   # isolate bit n at the
    spelled:   ["and tmp, rs, m", "bnez tmp, L"]         # sign, test via blt
    when: {m: single_bit}              # m == 1<<n
    bind: {s: XLEN-1 - n}

doc:
  - md: |
      # RISC-V template

       31         25 24     20 19     15 14 12 11      7 6           0
      ┌─────────────┬─────────┬─────────┬─────┬─────────┬─────────────┐
      │   funct7    │   rs2   │   rs1   │ fn3 │   rd    │   opcode    │   R-type
      └─────────────┴─────────┴─────────┴─────┴─────────┴─────────────┘
      │       imm[11:0]       │   rs1   │ fn3 │   rd    │   opcode    │   I-type
      │  imm[11:5]  │   rs2   │   rs1   │ fn3 │imm[4:0] │   opcode    │   S-type
      │imm[12|10:5] │   rs2   │   rs1   │ fn3 │[4:1|11] │   opcode    │   B-type
      │              imm[31:12]               │   rd    │   opcode    │   U-type
      │         imm[20|10:1|11|19:12]         │   rd    │   opcode    │   J-type

      # Overview

      ## Constraints and general patterns

       * The rd field must not be x0 or x2 when it describes a register
         (sometimes it is an immediate, and then the bit pattern is allowed).
         Encoding these registers here is reserved for different
         instructions, as is demonstrated in the prologue/epilogue pairs.
       * the value of `k` in instruction templates is the size of the
         corresponding load or store data width.  The value of `X` in `shXadd`
         mnemonics is the corresponding bit shift.
       * When `imma` or `immb` are required to be 6-bit immediates, the extra
         bits are stored in bits `g` and `h` respectively.  Otherwise these
         bits are used to extend the range of the `funct3` field.

  - reserved:
      - where: rd field
        regs: [x0, x2]
        status: active
        note: >-
          When rd names a register it may not be x0 or x2 (sp); those two bit
          patterns are sentinels selecting the prologue / epilogue / jump
          marker formats (drawn "0 0 0 1 0").
    note: >-
      No general register block is reserved at present. Earlier drafts held out
      a contiguous block — the high registers x16..x31, or the low x0..x3 — to
      give dual-rsd and similar frames a fallback under encoding-space pressure,
      but the current layout fits without it. Such a block remains an option to
      reserve if a future frame ever needs one.

  - md: |
      # Chain rules

       * One defined output register, plus x31 becomes undefined.
       * First instruction produces result for use by second instruction
       * Generally second operation produces result, but second op may have no output
         (eg., store, branch) meaning result comes from first, or there's no result at all.

  - frame:
      name: chain-alu-pair
      budget: 256
      level: 2
      templates:
        - ["alu     tmp, rs1a, rs2a/imma", "alu     rdb, tmp, rs2b/immb"]
      ops:
        - {a: *chain_alu, b: *chain_alu}
      rows:
        - ["h", "rs2b",      "g", "rs2a",      "rs1a", "fn3", "rdb"]
        - ["h", "rs2b",      "g", "imma[4:0]", "rs1a", "fn3", "rdb"]
        - ["h", "immb[4:0]", "g", "rs2a",      "rs1a", "fn3", "rdb"]
        - ["h", "immb[4:0]", "g", "imma[4:0]", "rs1a", "fn3", "rdb"]

  - frame:
      name: load-chain-alu-pair
      # lwu dropped from the A slot: 2 loads x weight 2 x 16 = 64 codepoints,
      # down from 96, so the block halves 128 -> 64. That is what clears the
      # namespace over-reservation (1036 -> 972 of 1024) without touching the
      # 16x16 ALU lists, which earn their keep.
      #
      # lwu rather than lw because lwu does not exist in RV32 -- a frame whose
      # only 32-bit load is lwu is dead to 32-bit targets, and those are the
      # ones that most need the compression. Cost is 27 corpus pairs (lwu) vs
      # 10 (lw); both are noise against ~20k.
      #
      # This is not a verdict on lwu. Of 694 lwu-bearing adjacencies in godot
      # only 56 are claimed by ANY frame -- it is broadly unserved rather than
      # concentrated here, and deserves a design pass across all frames rather
      # than a decision anchored on this one's 27 hits. Revisit then.
      budget: 64
      level: 2
      templates:
        - ["load    tmp, k*imma(rs1a)", "alu     rdb, tmp, rs2b/immb"]
        - ["load    tmp, k*imma(sp)", "alu     rdb, tmp, rs2b/immb"]
      ops:                     # 6-bit load offset via the opcode list, not a g bit
        # The template reads `k*imma`: a width-scaled, non-negative offset. The
        # sixth bit rides the opcode list rather than a g bit, hence bits: 6 on
        # a row that only draws imma[4:0].
        - {a: [{op: lw, imm: {bits: 6, signed: false, scale: 4}},
               {op: ld, imm: {bits: 6, signed: false, scale: 8}}], b: *chain_alu}
      rows:
        - ["h", "rs2b",      "g", "imma[4:0]", "rs1a", "fn3", "rdb"]
        - ["h", "immb[4:0]", "g", "imma[4:0]", "rs1a", "fn3", "rdb"]
        - {c: ["h", "rs2b",      "g", "imma[4:0|9:5]*2", "fn3", "rdb"], tag: SP-relative}
        - {c: ["h", "immb[4:0]", "g", "imma[4:0|9:5]*2", "fn3", "rdb"], tag: SP-relative}

  - frame:
      name: store-chain-alu-pair
      budget: 32
      level: 2
      templates:
        - ["alu     tmp, rs1a, rs2a/imma", "store   tmp, k*immb(rs1b)"]
        - ["alu     tmp, rs1a, rs2a/imma", "store   tmp, k*immb(sp)"]
      ops:
        - {a: *chain_alu, b: [sw, sd]}
      rows:
        - ["h", "rs1b",      "g", "rs2a",      "rs1a", "fn3", "immb[4:0]"]
        - ["h", "rs1b",      "g", "imma[4:0]", "rs1a", "fn3", "immb[4:0]"]
        - {c: ["h", "immb[9:5]", "g", "rs2a",      "rs1a", "fn3", "immb[4:0]"], tag: SP-relative}
        - {c: ["h", "immb[9:5]", "g", "imma[4:0]", "rs1a", "fn3", "immb[4:0]"], tag: SP-relative}

  - frame:
      name: addi-store-pair
      # Carved out of store-chain-alu-pair: compute an addi, then store it.
      #
      #     A: addi tmp, rs1a, imma      B: store tmp, k*immb(sp)  or  0(rbase)
      #
      # tmp is dead at the store so it is never encoded, which frees the space
      # for a 10-bit immediate alongside a full 5-bit rs1a. That is the whole
      # point of the carve-out: chain_alu cannot afford a wide immediate,
      # because widening its addi costs chain-alu codepoints quadratically,
      # whereas here there is no second register field competing for room.
      #
      # Measured: an all-5-bit version of this frame is worth only +81 pairs,
      # against +525 for this one. So ~85% of the frame's value is the wide
      # immediate, not the pairing shape -- which is also why store-chain,
      # capped at addi@6b, claims only 23 of the 1178 candidate sites.
      #
      # Address split: sp takes a 5-bit width-scaled offset, a base register
      # takes zero offset. Measured against the alternative (imm8 + a 2-bit
      # base offset, which scores marginally higher raw): on the base side the
      # two differ by 5 pairs, and after discounting what a base-capable
      # store-chain would reach anyway it is 1 versus 1. The wider immediate is
      # free, so it wins on the tie.
      budget: 4
      level: 2
      templates:
        - ["addi    tmp, rs1a, imma", "store   tmp, 0(rbase)"]
        - ["addi    tmp, rs1a, imma", "store   tmp, k*immb(sp)"]
      ops:
        - {a: [{op: addi, imm: {bits: 10, signed: true}}], b: [sb, sh, sw, sd]}
      rows:
        - ["h", "rs1a", "g", "imma[4:0|9:5]*2", "fn3", "rbase"]
        - {c: ["h", "rs1a", "g", "imma[4:0|9:5]*2", "fn3", "immb[4:0]"], tag: SP-relative}
      notes: |
         * The data width comes from the op list (sb/sh/sw/sd), as in the other
           memory frames, rather than a width field -- 4 codepoints is cheaper
           than two bits of layout, and it matches existing convention. sh
           captures nothing on this corpus but only 3 sites carry it, which is
           too thin to conclude it never would.
         * A covers li (rs1a = x0), mv (imma = 0) and addi4spn (rs1a = sp) as
           register/immediate choices, so they need no opcodes of their own.

  - frame:
      name: "deref-chain-load-pair, base-chain-load-pair"
      budget: 64
      level: 2
      templates:
        - ["load    tmp, k*imma(rs1a)", "load    rdb, k*immb(tmp)"]
      ops:
        - {a: *loads, b: *loads}
      rows:
        - ["h", "imma[9:5]", "g", "imma[4:0]", "rs1a", "fn3", "rdb"]
        - ["h", "immb[9:5]", "g", "immb[4:0]", "rs1a", "fn3", "rdb"]
      notes: |
         * TODO: decide how to balance imma and immb sizes.
         * TODO: maybe use g and h for the other immediate?  Or switch them between +2 bits on a or b
           immediate?

  - frame:
      name: chain-li-branch
      budget: 16
      level: 2
      templates:
        - ["li      tmp, imma", "bXX     rs1b, tmp, 4*immb"]
      ops:
        - {a: [*li_6s], b: *branches}
      rows:
        - ["h", "immb[9:5]", "imma[5:0]*2", "rs1b", "fn3", "immb[4:0]"]
      notes: |
         * For this frame `h` extends `imma` by one bit.
         * TODO: could replace li with alu op and compare result with zero (mostly?).

  - frame:
      name: chain-bit-test-branch
      budget: 32
      level: 2
      templates:
        - ["andi    tmp, rs1a, imma", "beqz/bnez tmp, immb"]
        - ["slli    tmp, rs1a, imma", "blt/bge tmp, zero, 4*immb"]
      ops:
        - {a: [andi, *slli_6u, *srli_6u], b: [beqz, bnez, beq, bne]}
      rows:
        - ["h", "immb[9:5]", "imma[5:0]*2", "rs1a", "fn3", "immb[4:0]"]

  - md: |
      # Chain rules, but first op is result

  - frame:
      name: "load-sp-branch, load-base-branch"
      budget: 16
      level: 2
      templates:
        - ["load    rda, k*imma(sp)", "beqz/bnez rda, zero, 4*immb"]
        - ["load    rda, k*imma(rs1a)", "beqz/bnez rda, zero, 4*immb"]
      ops:
        - {a: *loads, b: [beqz, bnez]}
      rows:
        - ["h", "rda", "g", "imma[4:0]", "rs1a", "fn3", "immb[4:0]"]
        - {c: ["h", "rda", "g", "imma[4:0|9:5]*2", "fn3", "immb[4:0]"], tag: SP-relative}
      notes: |
         * For this frame `g` and `h` extend `immb` by two bits.

  - frame:
      name: addi-branch-pair
      budget: 32
      level: 2
      templates:
        - ["addi/addiw rsda, imma", "beqz/bnez rsda, zero, 4*immb"]
      ops:
        - {a: [*addi_6s, *addiw_6s], b: *branches}
      rows:
        - ["h", "immb[9:5]", "imma[5:0]*2", "rsda", "fn3", "immb[4:0]"]

  - md: |
      # pre/post increment addressing

      Also chain rules with surviving first result, but also sometimes a second result.

  - frame:
      name: pre-inc-pair
      budget: 8
      level: 2
      templates:
        - ["shXadd  rsda, rsda, rs2a", "load    rdb, k*immb(rsda)"]
        - ["addi    rsda, rsda, k*imma", "load    rdb, k*immb(rsda)"]
        - ["shXadd  rsda, rsda, rs2a", "store   rs2b, k*immb(rsda)"]
        - ["addi    rsda, rsda, k*imma", "store   rs2b, k*immb(rsda)"]
      ops:
        - {a: [addi],   b: [ld, lw, sd, sw]}
        - {a: [sh3add], b: [ld, sd]}
        - {a: [sh2add], b: [lw, sw]}
      rows:
        - ["h", "rs2b",      "g", "rs2a",      "rsda", "fn3", "immb[4:0]"]
        - ["h", "immb[4:0]", "g", "rs2a",      "rsda", "fn3", "rdb"]
        - ["h", "rs2b",      "g", "imma[4:0]", "rsda", "fn3", "immb[4:0]"]
        - ["h", "immb[4:0]", "g", "imma[4:0]", "rsda", "fn3", "rdb"]
      notes: |
         * TODO: Try zero memory offset and all the load/store permutations instead
         * TODO: decide how to balance imma and immb sizes (proper coordination switches pre/post incr).

  - frame:
      name: post-inc-pair
      rules_py_names: [post-inc-addi-pair, post-inc-shadd-pair]   # rule names in rules.py this frame covers
      budget: 16
      level: 2
      templates:
        - ["load    rda, k*imma(rsda)", "shXadd  rsda, rsda, rs2b"]
        - ["store   rs2a, k*imma(rsda)", "shXadd  rsda, rsda, rs2b"]
        - ["load    rda, k*imma(rsda)", "addi    rsda, rsda, k*immb"]
        - ["store   rs2a, k*imma(rsda)", "addi    rsda, rsda, k*immb"]
      ops:
        - {a: [ld, lw, sd, sw],     b: [addi]}
        - {a: [ld, sd],             b: [sh3add]}
        - {a: [lw, sw],             b: [sh2add]}
      rows:
        - ["h", "rs2b",      "g", "rs2a",      "rsda", "fn3", "imma[4:0]"]
        - ["h", "rs2b",      "g", "imma[4:0]", "rsda", "fn3", "rda"]
        - ["h", "immb[4:0]", "g", "rs2a",      "rsda", "fn3", "imma[4:0]"]
        - ["h", "immb[4:0]", "g", "imma[4:0]", "rsda", "fn3", "rda"]
      notes: |
         * Timing oddity here because reg in `rd` field is written in first cycle not second.
         * TODO: Try zero memory offset and all the load/store permutations instead
         * TODO: decide how to balance imma and immb sizes (proper coordination switches pre/post incr).

  - md: |
      # Other stuff

  - frame:
      name: mem-pair
      budget: 16
      level: 1
      templates:
        - ["load    rda, k*imm(rbase)", "load    rdb, k*imm+k(rbase)"]
        - ["store   rs2a, k*imm(rbase)", "store   rs2b, k*imm+k(rbase)"]
        - ["load    rda, k*imm(sp)", "load    rdb, k*imm+k(sp)"]
        - ["store   rs2a, k*imm(sp)", "store   rs2b, k*imm+k(sp)"]
      ops:            # shared opcode: both slots identical, so one singleton per op
        - {a: [lb],  b: [lb]}
        - {a: [lbu], b: [lbu]}
        - {a: [lh],  b: [lh]}
        - {a: [lhu], b: [lhu]}
        - {a: [lw],  b: [lw]}
        - {a: [lwu], b: [lwu]}
        - {a: [ld],  b: [ld]}
        - {a: [sb],  b: [sb]}
        - {a: [sh],  b: [sh]}
        - {a: [sw],  b: [sw]}
        - {a: [sd],  b: [sd]}
      rows:
        - ["h", "rda",  "imm[5:0]*2",       "rbase", "fn3", "rdb"]
        - ["h", "rs2b", "i", "rs2a",        "rbase", "fn3", "imm[4:0]"]
        - {c: ["h", "rda",  "g", "imm[4:0|9:5]*2", "fn3", "rdb"], tag: SP-relative}
        - {c: ["h", "rs2b", "g", "rs2a", "imm[9:5]", "fn3", "imm[4:0]"], tag: SP-relative}
      notes: |
         * For row two, `i` extends `imm` by one bit (consistent with `imma` extension but in a B-type frame).
         * both opcodes in a pair must be identical operations

  - frame:
      name: dual-arith2-pair
      budget: 16
      level: 1
      templates:
        - ["alu     rda, rs1a, rs2a", "alu     rdb, rs1a, rs2a"]
      ops:
        - {a: [add],    b: [sub]}
        - {a: [addw],   b: [subw]}
        - {a: [min],    b: [max]}
        - {a: [minu],   b: [maxu]}
        - {a: [mul],    b: [mulh, mulhu, mulhsu]}
        - {a: [div],    b: [rem]}
        - {a: [divu],   b: [remu]}
        - {a: [divw],   b: [remw]}
        - {a: [divuw],  b: [remuw]}
      rows:
        - ["h", "rda", "g", "rs2a", "rs1a", "fn3", "rdb"]

  - frame:
      name: dual-indep-pair
      # 11 codepoints: the triangle over li, mv, addi4spn_u6, where the last
      # weighs 2 (a 6-bit range over a 5-bit base field). That is 11 rather than
      # the ideal 10 because the triangle orders the OPCODES but has no syntax
      # to order two immediates of the SAME op, so the addi4spn/addi4spn
      # diagonal pays 2x2 where 2x3/2 would do. Deliberately left alone: 10 and
      # 11 both reserve the same 16-codepoint block, so the difference is a
      # don't-care until the frame grows past 16. See the `ops` header note.
      budget: 16
      level: 1
      templates:
        - ["mv      rda, rs1a", "mv/li   rdb, rs2b/immb"]
        - ["li      rda, imma", "li      rdb, immb"]
      # Order-insensitive: the two ops are independent, so (x, y) and (y, x)
      # compute the same thing and only ONE needs a codepoint. Written longhand
      # as a triangle in the canonical order mv < li < addi4spn -- the scheduler
      # normalises a pair into that order before encoding. A full cross product
      # here would be the bug it replaced: 3x3 = 9 codepoints to express 6
      # distinct packets. See the `ops` note in the header.
      #
      # The canonical order is NOT arbitrary: it must put register-form ops
      # first. The only row that gives A an immediate (imma[4:0]) also gives B
      # one, and there is no row pairing imma for A with rs2b for B -- so if A
      # takes an immediate, B must too. Ordering mv (register) ahead of li and
      # addi4spn (immediate) makes every cluster below land on a real row:
      # (mv,mv) row 0, (mv,li) and (mv,addi4spn) row 1, the rest row 2. The
      # earlier li-first order had it exactly backwards, admitting (li, mv),
      # which no row can encode, and excluding (mv, li), which row 1 encodes.
      ops:
        - {a: [mv],            b: [mv, li, *addi4spn_u6]}
        - {a: [li],            b: [li, *addi4spn_u6]}
        - {a: [*addi4spn_u6],  b: [*addi4spn_u6]}
      rows:
        - ["h", "rda", "g", "rs2b",      "rs1a",      "fn3", "rdb"]
        - ["h", "rda", "g", "immb[4:0]", "rs1a",      "fn3", "rdb"]
        - ["h", "rda", "g", "immb[4:0]", "imma[4:0]", "fn3", "rdb"]

  - frame:
      name: rsd-alu-pair
      budget: 256
      level: 2
      templates:
        - ["alu rsda, rsda, rs2a/imma", "alu rsdb, rsdb, rs2b/immb"]
      ops:
        - {a: *rsd_alu, b: *rsd_alu}
      rows:
        - ["h", "rs2b",      "g", "rs2a",      "rsda", "fn3", "rsdb"]
        - ["h", "rs2b",      "g", "imma[4:0]", "rsda", "fn3", "rsdb"]
        - ["h", "immb[4:0]", "g", "rs2a",      "rsda", "fn3", "rsdb"]
        - ["h", "immb[4:0]", "g", "imma[4:0]", "rsda", "fn3", "rsdb"]
      notes: |
         * The four register operands occupy the four 5-bit columns -- 20 bits,
           the whole operand budget -- so registers here are a FULL 5-bit field,
           x0..x31. An earlier note anticipated cutting them to 4 bits; that is
           not needed, and scheduler/rules.py enforcing x0..x15 was costing 377
           pairs across the corpus.

  - md: |
      # Function head and tail special cases

      Entry and exit into blocks makes alignment hard, so let's try to special-case as many common
      patterns as possible to tamp down the cost.

  - frame:
      name: prologue-pair
      budget: 2
      level: 2
      templates:
        - ["addi    sp, -16*imm", "store   rs1b, 16*imm-k(sp)"]
      ops:
        - {a: [addi], b: [sw, sd]}
      rows:
        - ["h", "rs1b", "g", "imm[4:0|9:5]*2", "fn3", "0 0 0 1 0"]

  - frame:
      name: epilogue-pair
      budget: 2
      level: 2
      templates:
        - ["addi    sp, 16*imm", "jr      rs1b"]
      ops:
        - {a: [addi], b: [jalr, ret]}
      rows:
        - ["h", "rs1b", "g", "imm[4:0|9:5]*2", "fn3", "0 0 0 1 0"]

  - md: |
      # Other desperate measures

  - frame:
      name: arith-jump-pair
      budget: 64
      level: 2
      templates:
        - ["alu     rsda, rsda, rs2a/imma", "jr/jalr rs1b"]
        - ["mv     rsda, rs2a", "jr/jalr rs1b"]
        - ["li     rsda, imma", "jr/jalr rs1b"]
      ops:
        - {a: *rsd_alu_j, b: [ret, jalr, j, jal]}
      rows:
        - ["h", "rs1b", "g", "rs2a",      "rsda", "fn3", "0 0 0 1 0"]
        - ["h", "rs1b", "g", "imma[4:0]", "rsda", "fn3", "0 0 0 1 0"]

  - frame:
      name: mvload-jump-pair
      # Set up a value, then transfer control. The counterpart to
      # arith-jump-pair: that frame's A slot is RSD (rd == rs1), so its rd field
      # is free for the sentinel. Here A's destination and source are DISTINCT
      # registers -- `mv a0, a5` before a tail call -- which needs two register
      # fields and so cannot fit there.
      #
      # 936 pairs across 742 functions, top contributor 3.2%: the argument-setup
      # idiom before a tail call or return. By A form: mv 599, li 191, load 146.
      # The mv destination is an ABI argument register 92% of the time (a0 60%)
      # and the jump NEVER reads it -- this is argument setup, not a chain.
      #
      # mv and the loads share one row: `mv rda, rs1a` is the load row with the
      # offset field ignored, which the opcode already distinguishes. li takes
      # its own row because its 10-bit immediate spans rs2+rs1.
      #
      # Load offsets are effectively always zero here (98.2% of the chained
      # cases, measured without the current rule's 2-bit filter), so imma[4:0]
      # is generous. That figure is one corpus idiom though -- 54 of 55 are the
      # same frame-pointer spill in RV32 -- so it is sized for a real vtable
      # dispatch that this corpus happens not to contain.
      budget: 16
      level: 2
      templates:
        - ["mv      rda, rs1a", "jr      rs1b"]
        - ["load    rda, k*imma(rs1a)", "jr      rs1b"]
        - ["li      rda, imma", "jr      rs1b"]
      ops:
        - {a: [mv, lbu, lw, ld], b: [ret, jalr, j]}
        - {a: [li], b: [ret, jalr, j]}
      rows:
        - ["h", "rs1b", "g", "imma[4:0]", "rs1a", "fn3", "rda"]
        - ["h", "rs1b", "g", "imma[4:0|9:5]*2", "fn3", "rda"]
      notes: |
         * `j` covers `jal x0`; a jal with a real destination is a call and is
           excluded from every jump frame. Jump displacements are unbounded and
           not encoded in these fields.

  - frame:
      name: arith-mem-pair
      budget: 64
      level: 1
      templates:
        - ["alu     rsda, rsda, rs2a/imma", "load    rdb, k*immb(rs1b)"]
        - ["alu     rsda, rsda, rs2a/imma", "store   rs2b, k*immb(rs1b)"]
      ops:
        - {a: [add, sub, and, or, addi], b: *mem}
      rows:
        - ["h", "rs1b", "g", "rs2a",      "rsda", "fn3", "rdb"]
        - ["h", "rs1b", "g", "imma[4:0]", "rsda", "fn3", "rs2b"]
      notes: |
         * For this frame `g` and `h` provide a 2-bit `immb`.
