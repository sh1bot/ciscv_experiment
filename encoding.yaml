# Structured source of truth for the pairing packet encoding.
# Render back to markdown with:  python3 util/encoding_render.py
#
# Every data row describes the seven variable columns h..rd; the renderer
# appends the invariant "opcode5 │1 0" tail (5-bit opcode + 2-bit marker "10",
# shown as bits). A cell may span N columns with a "*N" suffix (e.g.
# "imma[5:0]*2" spans g+rs2). Each field's ASCII box is width = 2*bits - 1, so
# individual bits align uniformly; bit widths below are the real encoding sizes
# and sum to 32 including opcode5(5)+marker(2). (funct3's box, 5 cols, can't
# hold the label, so it renders as "fn3".)

grid:
  columns:     [h, funct5, g, rs2, rs1, funct3, rd]
  display:     [1, 9,      1, 9,   9,   5,      9]
  bits:        [1, 5,      1, 5,   5,   3,      5]   # + opcode5(5) + marker(2) = 32

doc:
  - md: |
      # RISC-V template

       31         25 24     20 19     15 14 12 11      7 6           0
      ┌─────────────┬─────────┬─────────┬─────┬─────────┬─────────────┐
      │   funct7    │   rs2   │   rs1   │ fn3 │   rd    │   opcode    │   R-type
      └─────────────┴─────────┴─────────┴─────┴─────────┴─────────────┘
      │       imm[11:0]       │   rs1   │ fn3 │   rd    │   opcode    │   I-type
      │  imm[11:5]  │   rs2   │   rs1   │ fn3 │imm[4:0] │   opcode    │   S-type
      │imm[12|10:5] │   rs2   │   rs1   │ fn3 │[4:1|11] │   opcode    │   B-type
      │              imm[31:12]               │   rd    │   opcode    │   U-type
      │         imm[20|10:1|11|19:12]         │   rd    │   opcode    │   J-type

      # Overview

      ## Constraints and general patterns

       * The rd field must not be x0 or x2 when it describes a register
         (sometimes it is an immediate, and then the bit pattern is allowed).
         Encoding these registers here is reserved for different
         instructions, as is demonstrated in the prologue/epilogue pairs.
       * the value of `k` in instruction templates is the size of the
         corresponding load or store data width.  The value of `X` in `shXadd`
         mnemonics is the corresponding bit shift.
       * When `imma` or `immb` are required to be 6-bit immediates, the extra
         bits are stored in bits `g` and `h` respectively.  Otherwise these
         bits are used to extend the range of the `funct3` field.

  - reserved:
      - where: rd field
        regs: [x0, x2]
        status: active
        note: >-
          When rd names a register it may not be x0 or x2 (sp); those two bit
          patterns are sentinels selecting the prologue / epilogue / jump
          marker formats (drawn "0 0 0 1 0").
    note: >-
      No general register block is reserved at present. Earlier drafts held out
      a contiguous block — the high registers x16..x31, or the low x0..x3 — to
      give dual-rsd and similar frames a fallback under encoding-space pressure,
      but the current layout fits without it. Such a block remains an option to
      reserve if a future frame ever needs one.

  - md: |
      # Chain rules

       * One defined output register, plus x31 becomes undefined.
       * First instruction produces result for use by second instruction
       * Generally second operation produces result, but second op may have no output
         (eg., store, branch) meaning result comes from first, or there's no result at all.

  - frame:
      name: chain-alu-pair
      level: 2
      templates:
        - ["alu     tmp, rs1a, rs2a/imma", "alu     rdb, tmp, rs2b/immb"]
      ops:
        a: [addi, addiw, andi, add, addw, sub, subw, and, andn, or, xor, slli, srli, srai, mul, mulhu]
        b: [addi, addiw, andi, add, addw, sub, subw, and, andn, or, xor, slli, srli, srai, mul, mulhu]
      imm:
        imma: {signed: true, scale: 1}
        immb: {signed: true, scale: 1}
      rows:
        - ["h", "rs2b",      "g", "rs2a",      "rs1a", "fn3", "rdb"]
        - ["h", "rs2b",      "g", "imma[4:0]", "rs1a", "fn3", "rdb"]
        - ["h", "immb[4:0]", "g", "rs2a",      "rs1a", "fn3", "rdb"]
        - ["h", "immb[4:0]", "g", "imma[4:0]", "rs1a", "fn3", "rdb"]

  - frame:
      name: load-chain-alu-pair
      level: 2
      templates:
        - ["load    tmp, k*imma(rs1a)", "alu     rdb, tmp, rs2b/immb"]
        - ["load    tmp, k*imma(sp)", "alu     rdb, tmp, rs2b/immb"]
      ops:
        a: [lw, lwu, ld]
        b: [addi, addiw, andi, add, addw, sub, subw, and, andn, or, xor, slli, srli, srai, mul, mulhu]
      imm:
        imma: {signed: false, scale: w}
        immb: {signed: true, scale: 1}
      rows:
        - ["h", "rs2b",      "imma[5:0]*2",      "rs1a", "fn3", "rdb"]
        - ["h", "immb[4:0]", "imma[5:0]*2",      "rs1a", "fn3", "rdb"]
        - {c: ["h", "rs2b",      "g", "imma[4:0|9:5]*2", "fn3", "rdb"], tag: SP-relative}
        - {c: ["h", "immb[4:0]", "g", "imma[4:0|9:5]*2", "fn3", "rdb"], tag: SP-relative}

  - frame:
      name: store-chain-alu-pair
      level: 2
      templates:
        - ["alu     tmp, rs1a, rs2a/imma", "store   tmp, k*immb(rs1b)"]
        - ["alu     tmp, rs1a, rs2a/imma", "store   tmp, k*immb(sp)"]
      ops:
        a: [addi, addiw, andi, add, addw, sub, subw, and, andn, or, xor, slli, srli, srai, mul, mulhu]
        b: [sw, sd]
      imm:
        imma: {signed: true, scale: 1}
        immb: {signed: false, scale: w}
      rows:
        - ["h", "rs1b",      "g", "rs2a",      "rs1a", "fn3", "immb[4:0]"]
        - ["h", "rs1b",      "g", "imma[4:0]", "rs1a", "fn3", "immb[4:0]"]
        - {c: ["h", "immb[9:5]", "g", "rs2a",      "rs1a", "fn3", "immb[4:0]"], tag: SP-relative}
        - {c: ["h", "immb[9:5]", "g", "imma[4:0]", "rs1a", "fn3", "immb[4:0]"], tag: SP-relative}

  - frame:
      name: "deref-chain-load-pair, base-chain-load-pair"
      level: 2
      templates:
        - ["load    tmp, k*imma(rs1a)", "load    rdb, k*immb(tmp)"]
      ops:
        a: [lb, lbu, lh, lhu, lw, lwu, ld]
        b: [lb, lbu, lh, lhu, lw, lwu, ld]
      imm:
        imma: {signed: false, scale: w}
        immb: {signed: false, scale: w}
      rows:
        - ["h", "imma[9:5]", "g", "imma[4:0]", "rs1a", "fn3", "rdb"]
        - ["h", "immb[9:5]", "g", "immb[4:0]", "rs1a", "fn3", "rdb"]
      notes: |
         * TODO: decide how to balance imma and immb sizes.
         * TODO: maybe use g and h for the other immediate?  Or switch them between +2 bits on a or b
           immediate?

  - frame:
      name: chain-li-branch
      level: 2
      templates:
        - ["li      tmp, imma", "bXX     rs1b, tmp, 4*immb"]
      ops:
        a: [li]
        b: [beq, bne, blt, bge, bltu, bgeu]
      imm:
        imma: {signed: true, scale: 1}
        immb: {signed: true, scale: 4, unbounded: true}
      rows:
        - ["h", "immb[9:5]", "imma[5:0]*2", "rs1b", "fn3", "immb[4:0]"]
      notes: |
         * For this frame `h` extends `imma` by one bit.
         * TODO: could replace li with alu op and compare result with zero (mostly?).

  - frame:
      name: chain-bit-test-branch
      level: 2
      templates:
        - ["andi    tmp, rs1a, imma", "beqz/bnez tmp, immb"]
        - ["slli    tmp, rs1a, imma", "blt/bge tmp, zero, 4*immb"]
      ops:
        a: [andi, slli, srli]
        b: [beqz, bnez, beq, bne]
      imm:
        imma: {signed: false, scale: 1}
        immb: {signed: true, scale: 4, unbounded: true}
      rows:
        - ["h", "immb[9:5]", "imma[5:0]*2", "rs1a", "fn3", "immb[4:0]"]

  - md: |
      # Chain rules, but first op is result

  - frame:
      name: "load-sp-branch, load-base-branch"
      level: 2
      templates:
        - ["load    rda, k*imma(sp)", "beqz/bnez rda, zero, 4*immb"]
        - ["load    rda, k*imma(rs1a)", "beqz/bnez rda, zero, 4*immb"]
      ops:
        a: [lb, lbu, lh, lhu, lw, lwu, ld]
        b: [beqz, bnez]
      imm:
        imma: {signed: false, scale: w}
        immb: {signed: true, scale: 4, unbounded: true}
      rows:
        - ["h", "rda", "g", "imma[4:0]", "rs1a", "fn3", "immb[4:0]"]
        - {c: ["h", "rda", "g", "imma[4:0|9:5]*2", "fn3", "immb[4:0]"], tag: SP-relative}
      notes: |
         * For this frame `g` and `h` extend `immb` by two bits.

  - frame:
      name: addi-branch-pair
      level: 2
      templates:
        - ["addi/addiw rsda, imma", "beqz/bnez rsda, zero, 4*immb"]
      ops:
        a: [addi, addiw]
        b: [beq, bne, blt, bge, bltu, bgeu]
      imm:
        imma: {signed: true, scale: 1}
        immb: {signed: true, scale: 4, unbounded: true}
      rows:
        - ["h", "immb[9:5]", "imma[5:0]*2", "rsda", "fn3", "immb[4:0]"]

  - md: |
      # pre/post increment addressing

      Also chain rules with surviving first result, but also sometimes a second result.

  - frame:
      name: pre-inc-pair
      level: 2
      templates:
        - ["shXadd  rsda, rsda, rs2a", "load    rdb, k*immb(rsda)"]
        - ["addi    rsda, rsda, imma", "load    rdb, k*immb(rsda)"]
        - ["shXadd  rsda, rsda, rs2a", "store   rs2b, k*immb(rsda)"]
        - ["addi    rsda, rsda, imma", "store   rs2b, k*immb(rsda)"]
      ops:
        tuples: [[addi, ld], [addi, sd], [sh2add, lw], [sh2add, sw], [add, slt]]
      imm:
        imma: {signed: true, scale: 1}
        immb: {signed: false, scale: w}
      rows:
        - ["h", "rs2b",      "g", "rs2a",      "rsda", "fn3", "immb[4:0]"]
        - ["h", "immb[4:0]", "g", "rs2a",      "rsda", "fn3", "rdb"]
        - ["h", "rs2b",      "g", "imma[4:0]", "rsda", "fn3", "immb[4:0]"]
        - ["h", "immb[4:0]", "g", "imma[4:0]", "rsda", "fn3", "rdb"]
      notes: |
         * TODO: decide how to balance imma and immb sizes (proper coordination switches pre/post incr).

  - frame:
      name: "dual-mem-addi-pair, dual-mem-shadd-pair"
      level: 2
      templates:
        - ["load    rdb, 0(rsda)", "shXadd  rsda, rsda, rs2a"]
        - ["store   rs2a, 0(rsda)", "shXadd  rsda, rsda, rs2a"]
        - ["addi    rsda, rsda, k*imma", "load    rdb, -k*imma(rsda)"]
        - ["addi    rsda, rsda, k*imma", "store   rs2b, -k*imma(rsda)"]
      ops:
        tuples: [[ld, addi], [lw, addi], [lwu, addi], [sd, addi], [sw, addi], [ld, sh3add], [lw, sh2add], [lwu, sh2add], [sd, sh3add], [sw, sh2add]]
      imm:
        imm: {signed: false, scale: w, nonzero: remap}
      rows:
        - ["h", "rs2b",      "g", "rs2a",      "rsda", "fn3", "imma[4:0]"]
        - ["h", "imma[4:0]", "g", "rs2a",      "rsda", "fn3", "rdb"]
        - ["h", "rs2b",      "g", "imma[4:0]", "rsda", "fn3", "imma[4:0]"]
        - ["h", "imma[4:0]", "g", "imma[4:0]", "rsda", "fn3", "rdb"]
      notes: |
         * Note: somewhat contorted logic for coherent `rd` field usage.

  - md: |
      # Other stuff

  - frame:
      name: mem-pair
      level: 1
      templates:
        - ["load    rda, k*imm(rbase)", "load    rdb, k*imm+k(rbase)"]
        - ["store   rs2a, k*imm(rbase)", "store   rs2b, k*imm+k(rbase)"]
        - ["load    rda, k*imm(sp)", "load    rdb, k*imm+k(sp)"]
        - ["store   rs2a, k*imm(sp)", "store   rs2b, k*imm+k(sp)"]
      ops:
        same: [lb, lbu, lh, lhu, lw, lwu, ld, sb, sh, sw, sd]
      imm:
        imm: {signed: false, scale: w}
      rows:
        - ["h", "rda",  "imm[5:0]*2",       "rbase", "fn3", "rdb"]
        - ["h", "rs2b", "i", "rs2a",        "rbase", "fn3", "imm[4:0]"]
        - {c: ["h", "rda",  "g", "imm[4:0|9:5]*2", "fn3", "rdb"], tag: SP-relative}
        - {c: ["h", "rs2b", "g", "rs2a", "imm[9:5]", "fn3", "imm[4:0]"], tag: SP-relative}
      notes: |
         * For row two, `i` extends `imm` by one bit (consistent with `imma` extension but in a B-type frame).
         * both opcodes in a pair must be identical operations

  - frame:
      name: dual-arith2-pair
      level: 1
      templates:
        - ["alu     rda, rs1a, rs2a", "alu     rdb, rs1a, rs2a"]
      ops:
        tuples: [[add, sub], [addw, subw], [min, max], [minu, maxu], [mul, mulh], [mul, mulhu], [mul, mulhsu], [div, rem], [divu, remu], [divw, remw], [divuw, remuw]]
      rows:
        - ["h", "rda", "g", "rs2a", "rs1a", "fn3", "rdb"]

  - frame:
      name: dual-indep-pair
      level: 1
      templates:
        - ["mv      rda, rs1a", "mv/li   rdb, rs2b/immb"]
        - ["li      rda, imma", "li      rdb, immb"]
      ops:
        a: [li, mv, addi4spn]
        b: [li, mv, addi4spn]
      imm:
        imma: {signed: true, scale: 1}
        immb: {signed: true, scale: 1}
      rows:
        - ["h", "rda", "g", "rs2b",      "rs1a",      "fn3", "rdb"]
        - ["h", "rda", "g", "immb[4:0]", "rs1a",      "fn3", "rdb"]
        - ["h", "rda", "g", "immb[4:0]", "imma[4:0]", "fn3", "rdb"]

  - frame:
      name: rsd-alu-pair
      level: 2
      templates:
        - ["alu rsda, rsda, rs2a/imma", "alu rsdb, rsdb, rs2b/immb"]
      ops:
        a: [addi, addiw, andi, add, addw, sub, subw, and, andn, or, xor, slli, srli, srai, mul, mulhu]
        b: [addi, addiw, andi, add, addw, sub, subw, and, andn, or, xor, slli, srli, srai, mul, mulhu]
      imm:
        imma: {signed: true, scale: 1}
        immb: {signed: true, scale: 1}
      rows:
        - ["h", "rs2b",      "g", "rs2a",      "rsda", "fn3", "rsdb"]
        - ["h", "rs2b",      "g", "imma[4:0]", "rsda", "fn3", "rsdb"]
        - ["h", "immb[4:0]", "g", "rs2a",      "rsda", "fn3", "rsdb"]
        - ["h", "immb[4:0]", "g", "imma[4:0]", "rsda", "fn3", "rsdb"]
      notes: |
         * TODO: these will probably have to be cut down to 4-bit register fields.

  - md: |
      # Function head and tail special cases

      Entry and exit into blocks makes alignment hard, so let's try to special-case as many common
      patterns as possible to tamp down the cost.

  - frame:
      name: prologue-pair
      level: 2
      templates:
        - ["addi    sp, -16*imm", "store   rs1b, 16*imm-k(sp)"]
      ops:
        a: [addi]
        b: [sw, sd]
      imm:
        imma: {signed: false, scale: 16, nonzero: true, negated: true}
      rows:
        - ["h", "rs1b", "g", "imm[4:0|9:5]*2", "fn3", "0 0 0 1 0"]

  - frame:
      name: epilogue-pair
      level: 2
      templates:
        - ["addi    sp, 16*imm", "jr      rs1b"]
      ops:
        a: [addi]
        b: [jalr, ret]
      imm:
        imma: {signed: false, scale: 16, nonzero: true}
      rows:
        - ["h", "rs1b", "g", "imm[4:0|9:5]*2", "fn3", "0 0 0 1 0"]

  - md: |
      # Other desperate measures

  - frame:
      name: arith-jump-pair
      level: 2
      templates:
        - ["alu     rsda, rsda, rs2a/imma", "jr/jalr rs1b"]
        - ["mv     rsda, rs2a", "jr/jalr rs1b"]
        - ["li     rsda, imma", "jr/jalr rs1b"]
      ops:
        a: [addi, addiw, andi, add, addw, sub, subw, and, andn, or, xor, slli, srli, srai, mul, mulhu]
        b: [ret, jalr, j, jal]
      imm:
        imma: {signed: true, scale: 1}
      rows:
        - ["h", "rs1b", "g", "rs2a",      "rsda", "fn3", "0 0 0 1 0"]
        - ["h", "rs1b", "g", "imma[4:0]", "rsda", "fn3", "0 0 0 1 0"]

  - frame:
      name: arith-mem-pair
      level: 1
      templates:
        - ["alu     rsda, rsda, rs2a/imma", "load    rdb, k*immb(rs1b)"]
        - ["alu     rsda, rsda, rs2a/imma", "store   rs2b, k*immb(rs1b)"]
      ops:
        a: [add, sub, and, or, addi]
        b: [lb, lbu, lh, lhu, lw, lwu, ld, sb, sh, sw, sd]
      imm:
        imma: {signed: true, scale: 1}
        immb: {signed: false, scale: w}
      rows:
        - ["h", "rs1b", "g", "rs2a",      "rsda", "fn3", "rdb"]
        - ["h", "rs1b", "g", "imma[4:0]", "rsda", "fn3", "rs2b"]
      notes: |
         * For this frame `g` and `h` provide a 2-bit `immb`.
