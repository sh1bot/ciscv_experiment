# Structured source of truth for the pairing packet encoding.
# Render back to markdown with:  python3 util/encoding_render.py
#
# Every data row describes the seven variable columns h..rd; the renderer
# appends the invariant "opcode5 │1 0" tail (5-bit opcode + 2-bit marker "10",
# shown as bits). A cell may span N columns with a "*N" suffix (e.g.
# "g", "imma[4:0]" spans g+rs2). Each field's ASCII box is width = 2*bits - 1, so
# individual bits align uniformly; bit widths below are the real encoding sizes
# and sum to 32 including opcode5(5)+marker(2). (funct3's box, 5 cols, can't
# hold the label, so it renders as "fn3".)
#
# A frame's `ops` is a list of {a: [...], b: [...]} clusters (bicliques). The
# allowed (opA, opB) pairs are the union of each cluster's a×b cross-product,
# and the opcode demand is the sum of the cluster products (clusters are
# disjoint). A cross-product frame is one cluster; a tuple-wise constraint is
# several; a shared-opcode frame (both slots identical) is a list of singleton
# {a: [x], b: [x]} clusters.
#
# ORDER-INSENSITIVE frames: when the two slots hold independent operations,
# (x, y) and (y, x) compute the same thing, so only one of them needs a
# codepoint. Such a frame must be written LONGHAND as a triangle over a stated
# canonical order — {a:[x], b:[x,y,z]}, {a:[y], b:[y,z]}, {a:[z], b:[z]} — and
# the scheduler normalises each pair into that order before encoding. Writing
# the full cross product instead costs n² codepoints to express n(n+1)/2
# distinct packets, very nearly double. There is deliberately no `unordered:`
# shorthand: the triangle states the canonical order explicitly, which the
# encoder needs anyway, and it keeps the codepoint count a plain sum of cluster
# products with no special case in the tooling.
#
# KNOWN GAP — the same-op diagonal. The triangle orders the OPCODES, but has no
# syntax to order two immediates of the SAME opcode. When an op has ext > 0 it
# occupies several codepoints (one per range band), and its diagonal cell pays
# w×w where w(w+1)/2 would do: the (narrow, wide) and (wide, narrow) spellings
# of one op-pair are both encoded when a tie-breaker on the range band would
# need only one. The waste is w(w-1)/2 per such op — 1 codepoint at ext=1, 6 at
# ext=2 — and it is zero for every op at the base range.
#
# This is a DON'T-CARE while the frame's count sits inside its block: blocks are
# powers of two, so a frame at 11 and a frame at 10 reserve the same 16 and the
# waste costs nothing real. It only becomes a decision if the waste is what
# pushes a count across a power-of-two boundary and doubles the reservation.
# dual-setup-pair pays 1 codepoint of it today, at 11 of 16 — five to spare
# before it would matter.
#
# Ordering the two immediates by VALUE (not just by range band) would be more
# efficient still — a strict ordering makes one of each equal-size pair
# redundant — but the decoder would have to compare the two immediates and
# conditionally swap them before use. Deliberately not pursued: the coding gain
# is small and the decode cost is not.
#
# A frame's optional `budget` is a sanity check on its codepoint count (see
# `python3 util/encoding_render.py --opcodes`): the count must land in
# (budget/2, budget]. Over the budget means too many ops for the allotted
# block; under half means the table is not yet filled in (or the budget is too
# large). Usually a power of two — the size of the prefix-code block the frame
# is allocated.

grid:
  columns:     [h, funct5, g, rs2, rs1, funct3, rd]
  display:     [1, 9,      1, 9,   9,   5,      9]
  bits:        [1, 5,      1, 5,   5,   3,      5]   # + opcode5(5) + marker(2) = 32
  # The named fields and their machine-word bit positions.  A row is a mapping
  # over the OPERAND-BEARING fields only: any field a row leaves unset is free
  # for opcode assignment, and `g`, `h`, `funct3`, `opcode5` and `marker` are
  # not writable by a row at all -- they are opcode bits.  `rd: unused` means
  # the column carries no operand and the enumerator allocates its selector
  # pattern from the reserved pool (the x0/x2 sentinels, A1.11).  A field split
  # between two operands states its sub-parts explicitly as {bits, value}
  # entries, most-significant first, summing to the field's width.
  fields:
    h:       {bits: [31, 31]}
    funct5:  {bits: [30, 26]}
    g:       {bits: [25, 25]}
    rs2:     {bits: [24, 20]}
    rs1:     {bits: [19, 15]}
    funct3:  {bits: [14, 12]}
    rd:      {bits: [11, 7]}
    opcode5: {bits: [6, 2]}
    marker:  {bits: [1, 0], value: 0b10}

# Named opcode sets, referenced from frame `ops` via YAML aliases (*name).
# Kept here so the large recurring lists are written once.
# Pseudo-ops: what an op NAME in a frame's `ops` list actually means.
#
# A yaml op name like `li` is not an opcode -- it is a register/immediate
# pattern on a real one, and every consumer needs the same translation
# (rules.py's mnemonic sets, imm_contracts, rules_conform's probes,
# encoding_budget's subform, isa/instruction.py's predicates).  Stated once
# here (A1.9); consumers read it rather than each carrying a copy.
#
# ENCODE and MATCH are deliberately different, because they answer
# different questions:
#
#   `encode` is the canonical form a packet EMITS.  This encoding has no
#   immediate-zero codepoint -- a zero immediate would be indistinguishable
#   from the register form -- so `mv` emits as `add rd, x0, rs`, NOT as
#   `addi rd, rs, 0`.  There is exactly one encode form per pseudo-op.
#
#   `match` is what the SCHEDULER accepts on input.  Corpus assembly has
#   been through an assembler and any number of rewrites, so the same
#   intent arrives spelled several ways; every spelling must be recognised
#   or the pair is silently lost.  Be liberal here and strict in `encode`.
#
# Guards that are NOT expressible as operand patterns stay in the code and
# are named here so the reason is not lost: `li`/`mv` require a RESOLVED
# immediate (an unresolved relocation such as `addi rd, x0, %lo(sym)` must
# never be treated as a load-immediate or a move -- dropping the relocation
# mis-encodes it), and `addi_rsd` must be tested before `addi4spn` (an
# `addi sp, sp, -32` frame adjust is a read-modify-write of sp belonging to
# prologue/epilogue, not an sp-relative address).
pseudo_ops:
  li:
    base: addi
    encode: {rs1: x0}                    # addi rd, x0, imm
    match:  [{op: addi, rs1: x0}]
    requires: resolved-immediate
  mv:
    base: addi
    encode: {op: add, rs2: x0}           # add rd, x0, rs -- NOT addi rd,rs,0
    match:  [{op: addi, imm: 0},         # the assembler's spelling
             {op: add,  rs2: x0},        # the canonical form, either operand
             {op: add,  rs1: x0}]
    requires: resolved-immediate
  addi4spn:
    base: addi
    encode: {rs1: x2}                    # addi rd, sp, imm (scaled x4)
    match:  [{op: addi, rs1: x2, imm: nonzero}]
    after: addi_rsd                      # frame adjusts are not addi4spn
  addi_rsd:
    base: addi
    encode: {rd: rs1}                    # addi rd, rd, imm
    match:  [{op: addi, rd: rs1}]
  inc:
    base: addi
    encode: {rd: rs1, imm: 1}
    match:  [{op: addi, rd: rs1, imm: 1}, {op: addiw, rd: rs1, imm: 1}]
  dec:
    base: addi
    encode: {rd: rs1, imm: -1}
    match:  [{op: addi, rd: rs1, imm: -1}, {op: addiw, rd: rs1, imm: -1}]
  j:
    base: jal
    encode: {rd: x0}
    match:  [{op: jal, rd: x0}, {op: j}]
  jalr_ra:
    base: jalr
    encode: {rd: x1, rs1: x1}            # jalr ra, imm(ra) -- a far CALL
    match:  [{op: jalr, rd: x1, rs1: x1}]
  jr_t1:
    base: jalr
    encode: {rd: x0, rs1: x6}            # jr imm(t1) -- a far TAIL call
    match:  [{op: jalr, rd: x0, rs1: x6}]
  # The two LINK-register spellings of a register-indirect transfer.  These
  # hard-code rd and leave rs1 free, where jalr_ra/jr_t1 above hard-code both:
  # the base is the frame's chain temporary, so only the link is an op choice.
  # Which registers may appear here is the yaml's to say, and rules.py reads
  # it (imm_contracts.link_regs_for) rather than keeping its own copy.
  jalr_link_ra:
    base: jalr
    encode: {rd: x1}                     # jalr ra, rs -- an indirect CALL
    match:  [{op: jalr, rd: x1}]
    after: jalr_ra                       # jalr ra, imm(ra) is arg-call-pair's
  jalr_link_t1:
    base: jalr
    encode: {rd: x6}                     # jalr t1, rs -- a linking JUMP
    match:  [{op: jalr, rd: x6}]
  ret:
    base: jalr
    encode: {rd: x0, rs1: x1, imm: 0}
    match:  [{op: jalr, rd: x0, rs1: x1, imm: 0}, {op: ret}]
  beqz:
    base: beq
    encode: {rs2: x0}
    match:  [{op: beq, rs2: x0}, {op: beqz}]
  bnez:
    base: bne
    encode: {rs2: x0}
    match:  [{op: bne, rs2: x0}, {op: bnez}]

# Meta-variables a template line may use, beyond the operand names.
template_legend:
  k: "the access width in bytes of the load or store on that line (1/2/4/8)"
  X: "the shift amount in a shXadd mnemonic (1, 2 or 3)"
  tmp: "the chain temporary -- a fixed architectural register, not a field"
  "N*imm": "the field is scaled by N; its low log2(N) bits are structurally zero"

opsets:
  # The RSD set, shared by rsd-alu-pair and arith-jump-pair. Both slots write
  # `alu rsd, rsd, ...` -- rd and rs1 are the SAME field -- so li (rs1=x0) is
  # NOT reachable by register choice the way it is in a chain slot, and needs
  # its own codepoint. It is also the single most common op in either frame
  # (3316 of 5934 slot uses), which is why it earns the wide field.
  #
  # Chosen by the same search used for alu_chain: the two rules widened to a
  # generous op set with unrestricted immediates, the REAL checks run over the
  # corpus, then a knapsack over the pairs that came back. Priced W^2 + 4W --
  # rsd-alu-pair is a full cross product (W x W = 256) and arith-jump-pair is
  # the set against 4 jump ops (W x 4 = 64) -- so W=16 is exactly the 320
  # codepoints the two frames already reserve.
  #
  # Width beats breadth decisively here, and it is addi that wants it: 36% of
  # addi_rsd sites sit at exactly 6 bits (|imm| 32..63, the stack-adjust and
  # loop-stride population), so a 5-bit field lands just under the mass and
  # cuts the frame in half. An all-5-bit set with 16 opcodes scores 1871
  # against this set's 4273; thirteen extra opcodes recover ~90 pairs while
  # narrowing addi costs ~1700. Above 7 bits it is flat (8b buys 22 pairs for
  # four fewer opcodes), so 7 is the knee.
  rsd_alu:  &rsd_alu
    - {op: addi, imm: {bits: 7, signed: true}}    # 4 codepoints; the RSD form
    - {op: li,   imm: {bits: 7, signed: true}}    # 4 codepoints; rd != rs1
    - add
    - {op: addiw, imm: {bits: 5, signed: true}}
    - and
    - {op: andi,  imm: {bits: 5, signed: true}}
    - or
    - {op: slli,  imm: {bits: 5, signed: false}}
    - {op: srli,  imm: {bits: 5, signed: false}}
    - xor

  # Same ops for arith-jump-pair, but addi/li capped at the 5 bits its row
  # actually draws: that frame spends its rd column on a sentinel, leaving only
  # `imma[4:0]`. Worth 414 candidate pairs if the row is ever widened -- see the
  # frame's notes. W=10, so 10 x 4 = 40 codepoints inside a budget of 64.
  # Every imm op carries a sixth bit (one doubling each): demand 40 -> 64
  # fills arith-jump-pair's 64-block exactly, so the range is free.  Census:
  # imm fit 73.7% -> 79.7% of 4861 A-slot immediates.
  rsd_alu_j: &rsd_alu_j
    - {op: addi, imm: {bits: 6, signed: true}}
    - {op: li,   imm: {bits: 6, signed: true}}
    - add
    - {op: addiw, imm: {bits: 6, signed: true}}
    - and
    - {op: andi,  imm: {bits: 6, signed: true}}
    - or
    - {op: slli,  imm: {bits: 6, signed: false}}
    - {op: srli,  imm: {bits: 6, signed: false}}
    - xor

  # The ALU set shared by the three CHAIN frames (alu-alu-chain,
  # load-alu-chain, alu-store-chain). Deliberately NOT *rsd_alu:
  # chain and rsd serve near-disjoint populations (ACCOUNTING.md §5), and a
  # chain slot is written `alu tmp, rs1a, ...` / `alu rdb, tmp, ...` with rs1
  # as an ENCODED FIELD -- so li (rs1=x0), mv (imm=0) and addi4spn (rs1=sp) are
  # all reached by choosing registers, not opcodes, and collapse into the one
  # `addi` codepoint. (rsd-alu-pair cannot do that: there rd and rs1 are the
  # same field, so li is unreachable and needs its own opcode -- see the
  # *rsd_alu note above, which is optimised separately over its own population.)
  #
  # Chosen by biclique search over the three chain populations jointly, priced
  # in codepoints: W=16 -> 16x16 + 4x16 + 16x2 = 256 + 64 + 32, exactly the
  # blocks already reserved.
  #
  # The search runs over pairs rules.py ACTUALLY accepts -- the rule widened to
  # a generous op set and an unrestricted immediate, then the real checks run
  # over the corpus. An earlier attempt optimised a structural population (any
  # ALU op in a chain position) and cost 93 pairs: it ignored the register
  # window, no_escape and commutative fitting, so its gains landed on pairs
  # rules.py rejects anyway while its losses landed on pairs it was accepting.
  #
  # Only addi earns extra range (7-bit, 4 codepoints) -- it carries li/mv, so it
  # is where the wide constants are. Spending 8 codepoints on an 8-bit addi, as
  # the first attempt did, buys almost nothing and starves the op list.
  # Re-optimised after const-store-pair was carved out: that frame drains the
  # `li tmp, K` + store cases from store-chain (869 -> 295 pairs), which were
  # what justified a 7-bit addi. 6 bits now suffice, freeing 2 slots for two
  # more opcodes. Capture over the three chain populations 578 -> 639.
  alu_chain: &alu_chain
    - {op: addi, imm: {bits: 6, signed: true}}     # 2 codepoints; carries li/mv
    - add
    - addw
    - and
    - andi
    - maxu
    - or
    - slli
    - sltiu
    - sltu
    - srli
    - srliw
    - sub
    - xor
    - xori
  # XLEN-switchable ops. A frame that spends ONE opcode on "the natural word"
  # -- as c.lwsp/c.ldsp do -- cannot name `lw` or `ld`, because which it means
  # depends on the base. These names do, and the mapping is declared HERE
  # rather than in the scheduler: it is a fact about the encoding, and the
  # scheduler will read it from this file once it parses the yaml directly,
  # switching after it deduces XLEN from the input (isa/xlen.detect_xlen reads
  # the corpus's own ELF-class header).
  #
  # Measured justification: sp-relative paired traffic is 100% lw/sw on RV32
  # and 98% ld/sd on RV64, so one switchable opcode covers essentially all of
  # it -- exactly as c.lwsp/c.ldsp share an encoding across XLEN.
  xlen_switchable:
    lx: {32: lw, 64: ld}
    sx: {32: sw, 64: sd}

  loads:    &loads    [lb, lbu, lh, lhu, lw, lwu, ld]
  branches: &branches [beq, bne, blt, bge, bltu, bgeu]
  mem:      &mem      [lbu, lhu, lw, ld, sb, sh, sw, sd]


  # Width-annotated ops: a bare mnemonic takes the frame's base immediate range;
  # these request an explicit wider range, and each bit of range above the base
  # doubles that op's opcode-codepoint footprint (an extended-range op costs 2
  # codepoints, one bit wider again costs 4, ...). On RV64 the shift amount is
  # 6-bit; these addi-family entries carry a 6-bit signed immediate.
  slli_6u:  &slli_6u  {op: slli,  imm: {bits: 6, signed: false}}
  srli_6u:  &srli_6u  {op: srli,  imm: {bits: 6, signed: false}}
  li_6s:    &li_6s    {op: li,    imm: {bits: 6, signed: true}}
  li_8s:    &li_8s    {op: li,    imm: {bits: 8, signed: true}}

  # addi4spn carries its scale in its name: the offset is always a multiple of
  # 4, so the low two bits are structurally zero and encoding them is waste.
  # The field is UNSIGNED because storage below sp is not safe to address --
  # an interrupt may clobber it -- so a negative offset is not a thing this op
  # ever legitimately has. Both are intrinsic properties of the opcode, but
  # addi4spn is named only in `ops` and never spelled out in a template line,
  # so there is no template coefficient to carry them; they are declared here
  # instead. Measured on the corpus: zero genuine addi4spn are negative, and
  # 99.6% are 4-aligned, so x4 costs nothing and buys ~2 bits of reach.
  # (Scale 8 reaches further still but strands the 4.5% that are 4- but not
  # 8-aligned, and over-fits godot's 64-bit pointers; 32-bit targets are the
  # ones that most need the compression, so x4 it is.)
  addi4spn_u6: &addi4spn_u6 {op: addi4spn, imm: {bits: 6, signed: false, scale: 4}}

  # A 6-bit `li`: a 5-bit field plus one opcode repeat.


# Equivalencies: surface forms the scheduler should accept as matching a frame
# because they are equivalent to the canonical form the packet encodes. Each
# entry pairs a `canonical` form (how the frame is written) with a `spelled`
# surface form seen in code; matching normalises spelled -> canonical. A guard
# on an immediate uses a named class that also binds a parameter n:
#     single_bit = 1<<n      low_mask = 2^n - 1      high_mask = -(2^n)
# `bind` then derives the canonical operands (e.g. a shift amount) from n.
# `tmp` is the dead intermediate — it matches only tmp, so a value-changing
# rewrite is licensed structurally, with no separate liveness test. Commutative
# operand swap is NOT here: the scheduler owns that.
#
# STARTING POINT for iteration — nothing consumes this yet. Mirrors the
# equivalencies rules.py currently codifies implicitly (see yaml_migration.md).
equivalences:
  - name: low-mask-zero-test           # E1: test the low n bits are zero
    canonical: ["slli tmp, rs, s", "beqz/bnez tmp, L"]
    spelled:   ["andi tmp, rs, m", "beqz/bnez tmp, L"]
    when: {m: low_mask}                # m == 2^n - 1
    bind: {s: XLEN - n}

  - name: high-mask-zero-test          # E2: test the high bits are zero
    canonical: ["srli tmp, rs, n", "beqz/bnez tmp, L"]
    spelled:   ["andi tmp, rs, m", "beqz/bnez tmp, L"]
    when: {m: high_mask}               # m == -(2^n)
    bind: {n: n}

  - name: zero-compare-eq              # E3: beq/bne against x0 is the zero test
    canonical: ["beqz rd, L"]
    spelled:   ["beq rd, zero, L"]
  - name: zero-compare-ne
    canonical: ["bnez rd, L"]
    spelled:   ["bne rd, zero, L"]

  - name: single-bit-sign-test         # candidate extension (not in rules.py):
    canonical: ["slli tmp, rs, s", "blt tmp, zero, L"]   # isolate bit n at the
    spelled:   ["and tmp, rs, m", "bnez tmp, L"]         # sign, test via blt
    when: {m: single_bit}              # m == 1<<n
    bind: {s: XLEN-1 - n}

doc:
  - reserved:
      - where: rd field
        regs: [x0, x2]
        status: active
        note: >-
          When rd names a register it may not be x0 or x2 (sp); those two bit
          patterns are sentinels selecting the prologue / epilogue / jump
          marker formats (drawn "0 0 0 1 0").  DECIDED (A1.11): this is
          enforced, not merely declared -- rules.py rejects rd in {x0, x2}
          wherever a row draws a register there.  The payoff is hosting: a
          sentinel-selected frame can ride inside another rd-bearing frame's
          opcode word, in the slice that frame's rd cannot reach, at zero
          opcode cost.  A frame may host only if its rd column holds a
          REGISTER in every row -- a frame whose rd carries immb[4:0] has no
          unreachable slice to lend.
    note: >-
      No general register block is reserved at present. Earlier drafts held out
      a contiguous block — the high registers x16..x31, or the low x0..x3 — to
      give dual-rsd and similar frames a fallback under encoding-space pressure,
      but the current layout fits without it. Such a block remains an option to
      reserve if a future frame ever needs one.

  - frame:
      name: alu-alu-chain
      does: "Two ALU operations, the second consuming the first's result."
      # Sized by measurement, and DELIBERATELY asymmetric -- the two slots want
      # different vocabularies, which the shared `alu_chain` anchor cannot say.
      # A is where values are produced (shifts, adds, comparisons); B is where
      # they are consumed (masking and merging).  `sltu`/`sltiu` appear only in
      # A -- a predicate is made, then spent -- and `and`/`or` only in B.
      #
      # At 15 ops per axis the block is 16x16 = 256 codepoints for 2502 pairs
      # (musl-rv32 + sqlite-rv64), 9.8 per codepoint.  Measured alternatives,
      # blocks exact (8^2 = 64, 11^2 = 121 <= 128, 16^2 = 256):
      #
      #   ops/axis  block  census pairs (3 corpora)  pairs/cp
      #      8        64            3755 (74%)          58.7
      #     11       128            4500 (88%)          35.2
      #     16       256            5090 (100%)         19.9
      #
      # Read as the marginal cost of KEEPING space: 64 -> 128 codepoints buys
      # 745 census pairs (11.6/cp) and 128 -> 256 buys 590 (4.6/cp).  Deflating
      # by the ~0.7 census-to-measured factor seen throughout this project puts
      # those at roughly 8 and 3 against a portfolio floor near 6, so the block
      # is 128.
      #
      # The op set MUST be fitted on all three corpora.  A set tuned on
      # musl-rv32 + sqlite-rv64 alone drops `srliw`, which cannot appear on
      # RV32 at all and is rare in sqlite -- but is C++'s second heaviest A op
      # (456 of 2588), so that set covers only 66% of the three-corpus
      # population against 88% here.  `andi` and `xori` are smaller versions of
      # the same trap.
      budget: 128
      level: 2
      templates:
        - ["alu     tmp, rs1a, rs2a/imma", "alu     rdb, tmp, rs2b/immb"]
      # TWO 8x8 blocks rather than one 11x11, because the population splits
      # into two vocabularies that barely interact and a single square pays
      # for every cross term between them.  Same argument as decoupling A from
      # B, one level up.  Measured over three corpora: 94% coverage against
      # 88% for 11x11, at 128 codepoints either way.
      ops:
        # Block 1 -- arithmetic and shift: address and index work.  3755 pairs
        # (74%), 59 per codepoint.  slli->add, srliw->addi, addi->srli.
        - a: [{op: addi, imm: &ac6 {bits: 6, signed: true}},   # 2 codepoints
              add, andi, slli, sltu, srliw, sub]
          b: [{op: addi, imm: *ac6},                           # 2 codepoints
              add, and, or, slli, srli, sub]
        # Block 2 -- logical and compare: predicate and bitfield work.  1020
        # pairs (20%), 16 per codepoint.  or->or, xori->add, sltiu->or.
        - a: [{op: addi, imm: *ac6}, and, or, sltiu, srli, xor, xori]
          b: [{op: addi, imm: *ac6}, add, andi, or, slli, sltiu, xor]
      rows:
        - {funct5: rs2b, rs2: rs2a, rs1: rs1a, rd: rdb}
        - {funct5: rs2b, rs2: "imma[4:0]", rs1: rs1a, rd: rdb}
        - {funct5: "immb[4:0]", rs2: rs2a, rs1: rs1a, rd: rdb}
        - {funct5: "immb[4:0]", rs2: "imma[4:0]", rs1: rs1a, rd: rdb}

  - frame:
      name: load-alu-chain
      does: "Load a value and immediately compute with it."
      # lwu dropped from the A slot: 2 loads x weight 2 x 16 = 64 codepoints,
      # down from 96, so the block halves 128 -> 64. That is what clears the
      # namespace over-reservation (1036 -> 972 of 1024) without touching the
      # 16x16 ALU lists, which earn their keep.
      #
      # lwu rather than lw because lwu does not exist in RV32 -- a frame whose
      # only 32-bit load is lwu is dead to 32-bit targets, and those are the
      # ones that most need the compression. Cost is 27 corpus pairs (lwu) vs
      # 10 (lw); both are noise against ~20k.
      #
      # This is not a verdict on lwu. Of 694 lwu-bearing adjacencies in godot
      # only 56 are claimed by ANY frame -- it is broadly unserved rather than
      # concentrated here, and deserves a design pass across all frames rather
      # than a decision anchored on this one's 27 hits. Revisit then.
      budget: 64
      level: 2
      templates:
        - ["load    tmp, k*imma(rs1a)", "alu     rdb, tmp, rs2b/immb"]
      ops:                     # 6-bit load offset via the opcode list, not a g bit
        # The template reads `k*imma`: a width-scaled, non-negative offset. The
        # sixth bit rides the opcode list rather than a g bit, hence bits: 6 on
        # a row that only draws imma[4:0].
        - {a: [{op: lw, imm: {bits: 6, signed: false, scale: 4}},
               {op: ld, imm: {bits: 6, signed: false, scale: 8}}], b: *alu_chain}
      rows:
        - {funct5: rs2b, rs2: "imma[4:0]", rs1: rs1a, rd: rdb}
        - {funct5: "immb[4:0]", rs2: "imma[4:0]", rs1: rs1a, rd: rdb}

  - frame:
      name: alu-store-chain
      does: "Compute a value and store it."
      budget: 32
      level: 2
      templates:
        - ["alu     tmp, rs1a, rs2a/imma", "store   tmp, k*immb(rs1b)"]
      ops:
        - {a: *alu_chain, b: [sw, sd]}
      rows:
        - {funct5: rs1b, rs2: rs2a, rs1: rs1a, rd: "immb[4:0]"}
        - {funct5: rs1b, rs2: "imma[4:0]", rs1: rs1a, rd: "immb[4:0]"}

  - frame:
      name: czero-or-chain
      does: "Finish a conditional select: merge the surviving arm into the result."
      # The second half of a zicond select:
      #     czero.eqz t1, x, c
      #     czero.nez t2, y, c     <- A
      #     or        r,  t1, t2   <- B
      # A's result is the chain temporary, so only four registers are encoded:
      # rs1a (the value), rs2a (the condition), rs2b (the other arm) and rdb.
      # That is exactly alu-alu-chain's row, which is why this needs no new
      # layout -- only its own frame, since adding czero to *alu_chain would
      # take that cross product from 16x16 to 18x18 and overflow its 256.
      #
      # The forward chain is overwhelmingly concentrated: of czero -> successor
      # adjacencies, 97-99% go to `or` on the four new corpora (963/975 on
      # sqlite-rv32, 639/640 on sqlite-rv64, 566/569 musl-rv32, 447/448
      # musl-rv64) against godot's 93%. Chained AND dead totals ~2492.
      #
      # The [czero, czero] shape is deliberately absent: both temporaries stay
      # live into the `or`, so it needs five register fields against 20 bits.
      # The backward directions were measured too and are not worth frames --
      # the condition is shared by the second arm so it is live 100% of the
      # time at the first, and the value-feed slice splits into small-immediate
      # `li` and wide-immediate `addi rd,rd,imm` populations that no single
      # field width serves.
      budget: 2
      level: 2
      templates:
        - ["czero.X tmp, rs1a, rs2a", "or      rdb, tmp, rs2b"]
      ops:
        - {a: [czero.eqz, czero.nez], b: [or]}
      rows:
        - {funct5: rs2b, rs2: rs2a, rs1: rs1a, rd: rdb}

  - frame:
      name: addi-store-chain
      does: "Form a value -- constant, copy or sp-relative address -- and store it."
      # Carved out of alu-store-chain: compute an addi, then store it.
      #
      #     A: addi tmp, rs1a, imma      B: store tmp, k*immb(sp)  or  0(rbase)
      #
      # tmp is dead at the store so it is never encoded, which frees the space
      # for a 10-bit immediate alongside a full 5-bit rs1a. That is the whole
      # point of the carve-out: alu_chain cannot afford a wide immediate,
      # because widening its addi costs alu-alu-chain codepoints quadratically,
      # whereas here there is no second register field competing for room.
      #
      # Measured: an all-5-bit version of this frame is worth only +81 pairs,
      # against +525 for this one. So ~85% of the frame's value is the wide
      # immediate, not the pairing shape -- which is also why store-chain,
      # capped at addi@6b, claims only 23 of the 1178 candidate sites.
      #
      # Address split: sp takes a 5-bit width-scaled offset, a base register
      # takes zero offset. Measured against the alternative (imm8 + a 2-bit
      # base offset, which scores marginally higher raw): on the base side the
      # two differ by 5 pairs, and after discounting what a base-capable
      # store-chain would reach anyway it is 1 versus 1. The wider immediate is
      # free, so it wins on the tie.
      budget: 4
      level: 2
      templates:
        - ["addi    tmp, rs1a, imma", "store   tmp, 0(rbase)"]
      ops:
        - {a: [{op: addi, imm: {bits: 10, signed: true}}], b: [sb, sh, sw, sd]}
      rows:
        - {funct5: rs1a, rs2: "imma[4:0]", rs1: "imma[9:5]", rd: rbase}
      notes:
        - >-
          The data width comes from the op list (sb/sh/sw/sd), as in the
          other memory frames, rather than a width field -- 4 codepoints is
          cheaper than two bits of layout, and it matches existing
          convention. sh captures nothing on this corpus but only 3 sites
          carry it, which is too thin to conclude it never would.
        - >-
          A covers li (rs1a = x0), mv (imma = 0) and addi4spn (rs1a = sp) as
          register/immediate choices, so they need no opcodes of their own.
  - frame:
      name: "deref-load-chain, base-load-chain"
      does: "Pointer chase in two forms: which of the two loads carries the offset."
      budget: 64
      level: 2
      templates:
        - ["load    tmp, k*imma(rs1a)", "load    rdb, k*immb(tmp)"]
      ops:
        - {a: *loads, b: *loads}
      rows:
        - {funct5: "imma[9:5]", rs2: "imma[4:0]", rs1: rs1a, rd: rdb}
        - {funct5: "immb[9:5]", rs2: "immb[4:0]", rs1: rs1a, rd: rdb}
      notes:
        - >-
          TODO: decide how to balance imma and immb sizes.
  - frame:
      name: li-branch-chain
      does: "Compare a register against a constant and branch."
      budget: 64
      level: 2
      templates:
        - ["li      tmp, imma", "bXX     rs1b, tmp, 4*immb"]
      ops:
        - {a: [*li_8s], b: *branches}
      rows:
        - {funct5: "immb[9:5]", rs2: "imma[4:0]", rs1: rs1b, rd: "immb[4:0]"}
      notes:
        - >-
          `imma` is a 5-bit register column; `li` declares 8 bits, bought by
          three opcode doublings (census li fit 66.9% -> 85.3% of 2293, ~13
          pairs/codepoint for the extra 32).
        - >-
          TODO: could replace li with alu op and compare result with zero
          (mostly?).
  - frame:
      name: bit-test-branch-chain
      does: "Test a bit or bit-field and branch on the result."
      budget: 32
      level: 2
      templates:
        - ["andi    tmp, rs1a, imma", "beqz/bnez tmp, immb"]
        - ["slli    tmp, rs1a, imma", "blt/bge tmp, zero, 4*immb"]
      ops:
        - {a: [{op: andi, imm: {bits: 6, signed: false}}, *slli_6u, *srli_6u], b: [beqz, bnez, beq, bne]}
      rows:
        - {funct5: "immb[9:5]", rs2: "imma[4:0]", rs1: rs1a, rd: "immb[4:0]"}

  - frame:
      name: load-base-branch-pair
      does: "Load a value and branch on whether it is zero; the value survives."
      budget: 16
      level: 2
      templates:
        - ["load    rda, k*imma(rs1a)", "beqz/bnez rda, zero, 4*immb"]
      ops:
        - {a: *loads, b: [beqz, bnez]}
      rows:
        - {funct5: rda, rs2: "imma[4:0]", rs1: rs1a, rd: "immb[4:0]"}
      notes:
        - >-
          `immb` is the branch displacement, a 5-bit field.  Displacements
          are unresolved labels in the corpus, so their fit is unmeasured.
  - frame:
      name: load-sp-branch-pair
      does: "Load a stack slot and branch on whether it is zero; the value survives."
      # The sp side of the old combined frame (the last undiscriminated
      # SP-relative row): with the base implicit, the freed rs1a
      # column pays for the 10-bit offset this traffic needs (5-bit fit is
      # only 66-69% on sp).  Ops mirror RVC's own split -- c.lwsp exists on
      # both widths, c.ldsp on rv64 only -- so plain lw/ld rather than the
      # switchable lx: unlike mem-sp-pair's ~100% natural-word traffic, the
      # scheduled mix here is genuinely mixed (rv64: ld 63%, lw 22%,
      # lbu 14%), and lbu's half of the block earns ~22 pairs/codepoint.
      budget: 8
      level: 2
      templates:
        - ["load    rda, k*imma(sp)", "beqz/bnez rda, zero, 4*immb"]
      ops:
        - {a: [lw, ld, lbu], b: [beqz, bnez]}
      rows:
        - {funct5: rda, rs2: "imma[4:0]", rs1: "imma[9:5]", rd: "immb[4:0]"}
      notes:
        - >-
          `immb` as in load-base-branch-pair: unresolved, fit unmeasured.
  - frame:
      name: inc-branch-pair
      does: "Step a loop counter by one and branch on the comparison."
      budget: 16
      level: 2
      templates:
        - ["inc/dec  rsda", "bXX     rsda, rs2b, 4*immb"]
      ops:
        - {a: [inc], b: [beq, bne, blt, bltu, bltu_r, bge, bgeu, bgeu_r]}
        - {a: [dec], b: [beq, bne, blt, bltu, bltu_r, bge_r, bgeu, bgeu_r]}
      # Mnemonics the scheduler may MATCH here beyond what the frame encodes
      # (measurement optimism, declared rather than left to drift).
      measures_also: {a: [addiw]}
      rows:
        - {funct5: "immb[9:5]", rs2: rs2b, rs1: rsda, rd: "immb[4:0]"}
      notes:
        - >-
          The step is +/-1, implied by the opcode (`inc`/`dec` = `addi rsda,
          rsda, +/-1`): 88% of adjacent counter-branch sites compare against
          a REGISTER, so the immediate column goes to `rs2b` instead of a
          step field; `rs2b = x0` gives every vs-zero form for free.  Full
          XLEN width only -- there are no `w` forms.
        - >-
          `_r` marks the operand-reversed spelling (the counter in rs2). The
          two clusters are the best sixteen JOINT direction x mode cells of
          the adjacent-site census, not a mode product: down-loops are
          bltu/bgeu-heavy (pointer-vs-limit, both operand orders), up-loops
          beq/bne with bge/bgeu sum-first.  Joint enumeration covers 98.7%
          of adjacent sites against ~79% for the best 4-mode x 2-direction
          product at the same sixteen entries.
        - >-
          The scheduler also matches `addiw rsd, rsd, +/-1` and bills it
          here.  That is optimistic for unsigned int counters on rv64
          (defined wrap is not width-equivalent) in the same spirit as RVC-
          eligibility; signed counters are provably width-equivalent
          (overflow is UB), so a packet-targeted compiler emits `addi`.
        - >-
          `immb` is the branch displacement in packets.  Displacements are
          unresolved labels in the corpus, so pairwise fit is unmeasured;
          the label-distance study puts 10-bit fit near 100%.
  - frame:
      name: li-czero-chain
      does: "Materialise a constant and conditionally zero it -- one arm of a select."
      # The other half of a zicond select: materialise one arm's constant, then
      # conditionally zero it. `li` is the chain temporary, so only two
      # registers are encoded (the condition and the destination), which leaves
      # ten bits for the immediate -- and because the row DRAWS ten, the op
      # declaring ten costs no extra codepoints.
      #
      # Sizing, from addi -> czero.rs1 (the VALUE operand) adjacencies:
      # `li` is 50-64% of them and its constants are small (60-81% fit 6 bits,
      # 87-93% fit 8), while the `addi rd,rd,imm` form is 33-42% and its
      # addends are almost all wide (only 3-16% fit 6 bits). They are two
      # populations and no single width serves both, so this frame takes only
      # the li form and gives it room.
      #
      # The constant is nearly always gone immediately: of the li -> czero
      # adjacencies, the czero OVERWRITES its register 59%/47% of the time
      # (`li a1,K; czero.nez a1,a1,c`) and it dies unreused a further 25%/28%
      # -- 84%/75% dead in total on sqlite-rv64/musl-rv64. Nothing is being
      # kept: of the 16%/25% that do survive, 39 of 48 and 39 of 40 have no use
      # within seven instructions, so they are crossing a branch rather than
      # feeding a second arm. A variant that encodes the surviving constant and
      # drops to a 5-bit immediate would be aimed at that minority; not built.
      #
      # (An earlier note here claimed only 26% were dead. That tested
      # `rd in live_out`, which counts the register as live when the czero is
      # itself what redefines it -- the same a.rd != b.rd subtlety that halved
      # index-mem-chain. @no_escape gets it right, which is why this frame
      # scored 107/116/53 against a population estimated at 78/87/45.)
      #
      # Immediate width, over the frame's actual scheduled hits:
      #                  <=5b   <=6b   <=7b   <=8b   <=10b
      #   sqlite-rv64     64%    70%    78%    92%    100%
      #   musl-rv64       58%    75%    81%    85%    100%
      #   sqlite-rv32     57%    63%    71%    91%    100%
      # Ten bits is free -- the row draws the field and the op declaring ten has
      # ext 0, so the frame is 2 codepoints at any width. Narrowing to five
      # would forfeit ~40% of the hits for nothing.
      #
      # The `addi rsd,rsd,imm` form was costed at the widths this shape could
      # afford (3 registers leaves a 5-bit field): ~7 adjacencies at 6 bits
      # and ~15 at 7, of 155 on sqlite-rv64. Its addends are wide because they
      # are offsets into a running value, not constants. Not viable.
      #
      # NOTE this frame and czero-or-chain overlap on any czero that has BOTH
      # a feeding li and a consuming or. Measured both RULES orders: the split
      # is identical either way (107 / 603 on sqlite-rv64), because the greedy
      # left-to-right pairer reaches the contested czero from the same side
      # regardless of rule priority. czero-or-chain is ordered first anyway,
      # so that if the population ever shifts the larger frame keeps the tie.
      #
      # THE THREE-WAY FUSION IS OUT OF SCOPE. A full select is
      #     czero.eqz t1, x, c ; czero.nez t2, y, c ; or r, t1, t2
      # and both czeros could in principle be fused with the merge: two
      # temporaries, four encoded operands (x, y, c, r), which fits the 20-bit
      # budget comfortably. That is a perfectly sound INSTRUCTION -- a
      # three-operand conditional select, `r = c ? x : y`, of the kind most
      # ISAs with predication provide outright, and the thing zicond's two
      # czeros plus an or are emulating in the first place.
      #
      # It is excluded solely by the pairwise contract -- a packet holds exactly
      # two instructions -- not by any field shortage. If that contract is ever
      # revisited this is the first candidate: it would take a 4-instruction
      # select to ONE packet, where this frame and czero-or-chain together
      # still need two.
      budget: 2
      level: 2
      templates:
        - ["li      tmp, imma", "czero.X rdb, tmp, rs2b"]
      ops:
        - {a: [{op: li, imm: {bits: 10, signed: true}}], b: [czero.eqz, czero.nez]}
      rows:
        - {funct5: rs2b, rs2: "imma[4:0]", rs1: "imma[9:5]", rd: rdb}

  - frame:
      name: index-mem-chain
      does: "Scaled-index addressing: compute `base + i*width` and access it."
      # RISC-V has no register+register addressing mode, so `array[i]` costs two
      # instructions: form the address, then access it. The address is a pure
      # temporary -- it exists only because the ISA has that hole.
      #
      # A scales an index and adds it to a base; B accesses through the result,
      # which is then dead. The computed address is the CHAIN TEMPORARY and is
      # not encoded, which is what makes three register operands fit: rs1a (the
      # index), rs2a (the base), and B's destination or stored value.
      #
      # Survival decides the shape. Of the width-matched shXadd->memory pairs,
      # the computed address dies after the access 84% of the time (sqlite-rv64
      # 1488/1779, musl-rv64 563/716) while the unscaled base survives 77% --
      # indexing keeps the array. Writing the sum back over the base, as
      # pre-inc-pair does, is therefore the minority case; and it is not a
      # register-allocation accident, because only 30-34% of these have any
      # dead input to clobber. pre-inc-pair keeps the surviving-sum cases (the
      # pointer walk) and is ordered after this frame.
      #
      # `add` is the scale-1 member of the family -- byte indexing needs no
      # shift -- and is the bulk of it: 1190 of 1779 on sqlite-rv64, where 94%
      # of accesses are byte-width and the index often comes straight from an
      # lbu (a table lookup). It is NOT reducible: there is no `lbu d, (b+i)`.
      #
      # `addi` is deliberately absent. With the sum as a temporary its addend
      # is just the access's own offset field, so `addi t,b,k; ld d,0(t)`
      # collapses to `ld d,k(b)` -- measured at 95-100% foldable.
      #
      # B's offset is scaled and 5 bits: zero in 86% of cases and in range for
      # 93%, and the field is free since the four columns hold exactly the
      # three registers plus it.
      budget: 8
      level: 2
      templates:
        - ["shXadd  tmp, rs1a, rs2a", "load    rdb, k*immb(tmp)"]
        - ["shXadd  tmp, rs1a, rs2a", "store   rs2b, k*immb(tmp)"]
      ops:                     # the shift must match the access width
        - {a: [add],    b: [lbu, sb]}
        - {a: [sh1add], b: [lhu, sh]}
        - {a: [sh2add], b: [lw, sw]}
        - {a: [sh3add], b: [ld, sd]}
      rows:
        - {funct5: rs2a, rs2: "immb[4:0]", rs1: rs1a, rd: rdb}
        - {funct5: rs2a, rs2: rs2b, rs1: rs1a, rd: "immb[4:0]"}

  - frame:
      name: pre-inc-pair
      does: "Advance a pointer, then access through it (pre-increment)."
      budget: 8
      level: 2
      templates:
        - ["shXadd  rsda, rsda, rs2a", "load    rdb, k*immb(rsda)"]
        - ["addi    rsda, rsda, k*imma", "load    rdb, 0(rsda)"]
        - ["shXadd  rsda, rsda, rs2a", "store   rs2b, k*immb(rsda)"]
        - ["addi    rsda, rsda, k*imma", "store   rs2b, 0(rsda)"]
      ops:            # addi split by width so each declares its true scale
        - {a: [{op: addi, imm: {bits: 10, signed: true, scale: 8}}], b: [ld, sd]}
        - {a: [{op: addi, imm: {bits: 10, signed: true, scale: 4}}], b: [lw, sw]}
        - {a: [sh3add], b: [ld, sd]}
        - {a: [sh2add], b: [lw, sw]}
      rows:
        - {funct5: rs2b, rs2: rs2a, rs1: rsda, rd: "immb[4:0]"}
        - {funct5: "immb[4:0]", rs2: rs2a, rs1: rsda, rd: rdb}
        - {funct5: rs2b, rs2: "imma[4:0]", rs1: "imma[9:5]", rd: rsda}
        - {funct5: rdb, rs2: "imma[4:0]", rs1: "imma[9:5]", rd: rsda}
      notes:
        - >-
          The addi rows access AT the bumped pointer: at genuine (non-
          prologue) surviving-sum sites the memory offset is zero 68-78% of
          the time, so the rows spend no immb and give the bump the freed
          column instead -- a 10-bit width-scaled imma, which the op
          declares at no extra codepoints.  Even so the bump population is
          structurally wide (record-sized walks: 10-bit scaled fit is
          39-59%); this is the affordable ceiling, not full coverage.
        - >-
          The shXadd rows keep the 5-bit scaled immb: their stride is the
          register, so the offset field still earns its column.
  - frame:
      name: post-inc-pair
      does: "Access through a pointer, then advance it (post-increment)."
      rules_py_names: [post-inc-pair]   # rule names in rules.py this frame covers
      budget: 4
      level: 2
      templates:
        - ["load    rda, k*imma(rsda)", "addi    rsda, rsda, k*immb"]
        - ["store   rs2a, k*imma(rsda)", "addi    rsda, rsda, k*immb"]
      # The stride is declared UNSIGNED, settling the A1.7 disagreement:
      # rules.py checked it as uimm5-with-remap (strides 1..32 x k, zero
      # remapped to 32 since a zero stride is meaningless) while the verifier,
      # finding a bare op, inferred addi's natural signedness and flagged
      # strides 17..32 x k.  The census sides with unsigned -- post-inc
      # strides are forward walks (16, 32, 48, 128...), essentially never
      # negative -- and unsigned-with-remap covers double the useful range.
      # Split per width cluster so each declares its true scale.
      ops:
        - {a: [ld, sd], b: [{op: addi, imm: {bits: 5, signed: false, scale: 8}}]}
        - {a: [lw, sw], b: [{op: addi, imm: {bits: 5, signed: false, scale: 4}}]}
      # A8.2 probe hint: a zero stride is meaningless (remapped to 32), so the
      # zero-immediate standard probes never reach this rule.
      probe:
        - {a: {op: ld, rd: 10, rs1: 12, imm: 0},
           b: {op: addi, rd: 12, rs1: 12, imm: 8}}
      rows:
        - {funct5: "immb[4:0]", rs2: rs2a, rs1: rsda, rd: "imma[4:0]"}
        - {funct5: "immb[4:0]", rs2: "imma[4:0]", rs1: rsda, rd: rda}
      notes:
        - >-
          Timing oddity here because reg in `rd` field is written in first
          cycle not second.
        - >-
          No shXadd clusters: a post-increment by a register-held stride is
          a real idiom, but neither clang nor GCC emits it adjacent to the
          access (zero scheduled pairs on every corpus).
        - >-
          Both fields earn their columns, unlike pre-inc: the access offset
          imma is the position inside an unrolled window (small, 67-74%
          within +/-16) and the stride immb is the window size (wide). They
          decouple under unrolling -- stride = offset + width holds at only
          3-19% -- so neither a zero offset nor a delta encoding works here.
  - frame:
      name: mem-sp-pair
      does: "Two adjacent stack accesses one word apart -- a spill or reload pair."
      # Separate from mem-base-pair because the layouts differ: with the base
      # implicit, the freed `rbase` column pays for a 10-bit shared offset,
      # and nothing in a shared opcode could tell the two row families apart
      # -- a combined frame would owe a discriminator bit.
      #
      # Two ops, not eight.  Measured over musl-rv32 and sqlite-rv64, paired
      # sp traffic is 100% lw/sw on RV32 and 98% ld/sd on RV64 -- always the
      # natural word -- so one switchable opcode each covers it, exactly as
      # c.lwsp/c.ldsp do.  `lx`/`sx` are declared in opsets.xlen_switchable and
      # resolved against the base the scheduler detects from the input.
      #
      # This is where mem-base-pair's traffic actually is: 85% of its pairs on
      # rv32 and 81% on rv64.  It is also the half that NEEDS the width --
      # sp offsets fit five bits only 41% of the time on rv32 against 97% for
      # base-register offsets, which is why the two want different layouts.
      budget: 2
      level: 1
      templates:
        - ["load    rda, k*imm(sp)", "load    rdb, k*imm+k(sp)"]
        - ["store   rs2a, k*imm(sp)", "store   rs2b, k*imm+k(sp)"]
      ops:            # same_op: the diagonal, as in mem-base-pair
        - a: [{op: lx, imm: &sp10 {bits: 10, signed: false}}, {op: sx, imm: *sp10}]
          b: [{op: lx, imm: *sp10}, {op: sx, imm: *sp10}]
          same_op: true
      # A8.2 probe hints: twin sp-based accesses one natural word apart.
      # Deltas are the rv32 word — the default base the conformance run uses
      # before any input settles XLEN; under an rv64-set run these hints
      # fail to match and the contracts report unverified rather than wrong.
      probe:
        - {a: {op: lx, rd: 10, rs1: 2, imm: 0},
           b: {op: lx, rd: 11, rs1: 2, imm: 4}, lockstep: true}
        - {a: {op: sx, rs1: 2, rs2: 10, imm: 0},
           b: {op: sx, rs1: 2, rs2: 11, imm: 4}, lockstep: true}
      rows:
        - {funct5: rda, rs2: "imm[4:0]", rs1: "imm[9:5]", rd: rdb}
        - {funct5: rs2b, rs2: rs2a, rs1: "imm[9:5]", rd: "imm[4:0]"}
      notes:
        - >-
          both opcodes in a pair must be identical operations
        - >-
          offsets differ by one data width, as in mem-base-pair
  - frame:
      name: mem-base-pair
      does: "Two adjacent accesses through one base register, one data width apart."
      budget: 16
      level: 1
      templates:
        - ["load    rda, k*imm(rbase)", "load    rdb, k*imm+k(rbase)"]
        - ["store   rs2a, k*imm(rbase)", "store   rs2b, k*imm+k(rbase)"]
      # Shared opcode (both slots identical) and a SHARED imm, so each op's
      # sixth bit is bought once per cluster (2 codepoints each, 16 total).
      # Census: base-offset fit 87.8% -> 94.1% of 10326; the earlier narrowing
      # to 5 was set from censored data.
      # `same_op` states the diagonal in the DATA: A and B must be the same
      # opcode, so this is 8 combinations, not 8x8.  Enumerating eight
      # singleton clusters priced the same but said the constraint only by how
      # the clusters were split -- a reader (or a tidy-up) could not tell it
      # from a free cross product.  The templates' generic `load`/`store`
      # placeholders are exactly that trap, which is why it is declared here.
      ops:
        - a: [{op: lbu, imm: &mp6 {bits: 6, signed: false}},
              {op: lhu, imm: *mp6}, {op: lw, imm: *mp6}, {op: ld, imm: *mp6},
              {op: sb, imm: *mp6}, {op: sh, imm: *mp6}, {op: sw, imm: *mp6},
              {op: sd, imm: *mp6}]
          b: [{op: lbu, imm: *mp6},
              {op: lhu, imm: *mp6}, {op: lw, imm: *mp6}, {op: ld, imm: *mp6},
              {op: sb, imm: *mp6}, {op: sh, imm: *mp6}, {op: sw, imm: *mp6},
              {op: sd, imm: *mp6}]
          same_op: true
      # Conformance probe hints (A8.2): the standard probe shapes cannot
      # construct twin same-base accesses one width apart, so the widths
      # above were unverifiable without these.  lockstep: scanning one offset
      # moves the other with it, preserving the delta.
      probe:
        - {a: {op: lbu, rd: 10, rs1: 12, imm: 0},
           b: {op: lbu, rd: 11, rs1: 12, imm: 1}, lockstep: true}
        - {a: {op: lhu, rd: 10, rs1: 12, imm: 0},
           b: {op: lhu, rd: 11, rs1: 12, imm: 2}, lockstep: true}
        - {a: {op: lw, rd: 10, rs1: 12, imm: 0},
           b: {op: lw, rd: 11, rs1: 12, imm: 4}, lockstep: true}
        - {a: {op: ld, rd: 10, rs1: 12, imm: 0},
           b: {op: ld, rd: 11, rs1: 12, imm: 8}, lockstep: true}
        - {a: {op: sb, rs1: 12, rs2: 10, imm: 0},
           b: {op: sb, rs1: 12, rs2: 11, imm: 1}, lockstep: true}
        - {a: {op: sh, rs1: 12, rs2: 10, imm: 0},
           b: {op: sh, rs1: 12, rs2: 11, imm: 2}, lockstep: true}
        - {a: {op: sw, rs1: 12, rs2: 10, imm: 0},
           b: {op: sw, rs1: 12, rs2: 11, imm: 4}, lockstep: true}
        - {a: {op: sd, rs1: 12, rs2: 10, imm: 0},
           b: {op: sd, rs1: 12, rs2: 11, imm: 8}, lockstep: true}
      rows:
        - {funct5: rda, rs2: "imm[4:0]", rs1: rbase, rd: rdb}
        - {funct5: rs2b, rs2: rs2a, rs1: rbase, rd: "imm[4:0]"}
      notes:
        - >-
          both opcodes in a pair must be identical operations
        - >-
          No `lb`, `lh` or `lwu`: they account for 12 of 37816 scheduled
          slots across musl-rv32 and sqlite-rv64.
  - frame:
      name: load-store-chain
      does: "Copy a value from one memory location to another."
      # A memory copy: the loaded value is stored straight back out and the
      # temporary dies.  Four operands -- two bases and two offsets -- fill the
      # 20-bit budget exactly, with the temp unencoded.
      #
      # Sizing, measured (results/corpus/FINDINGS.md).  The OFFSET WIDTH is the
      # binding constraint, not the op set: uncensored the population is 859
      # (musl-rv32) / 968 (sqlite-rv64) sites, of which only 39%/62% have both
      # scaled offsets inside five bits, 47%/95% inside six, 63%/98% inside
      # seven.  Six bits is the knee -- +12 codepoints over the 5-bit form for
      # +383 pairs (32/cp against a portfolio floor near 6), taking sqlite, the
      # corpus furthest from parity, from 62% to 95% capture.  Seven would cost
      # 64 codepoints for perhaps 150 more pairs.
      #
      # `same_width` is the diagonal: copies preserve width 96%/79% of the
      # time, and the truncating tail (`ld` -> `sw`, 122 pairs on sqlite) would
      # cost four times the block for ~12 pairs/cp, so it is left out.
      budget: 16
      level: 2
      templates:
        - ["load    tmp, k*imma(rs1a)", "store   tmp, k*immb(rs1b)"]
      ops:
        - a: [{op: lbu, imm: &mc6 {bits: 6, signed: false}}, {op: lhu, imm: *mc6},
              {op: lw, imm: *mc6}, {op: ld, imm: *mc6}]
          b: [{op: sb, imm: *mc6}, {op: sh, imm: *mc6},
              {op: sw, imm: *mc6}, {op: sd, imm: *mc6}]
          same_width: true
      # The scheduler also matches the SIGNED loads (`lb`, `lh`, `lwu`) and
      # encodes them as the unsigned form: a load feeding a store of the same
      # width writes identical bytes either way, so this is canonicalisation,
      # not optimism.
      measures_also: {a: [lb, lh, lwu]}
      probe:            # ld/sd sit past the per-slot probe sampling limit
        - {a: {op: lw, rd: 31, rs1: 12, imm: 0},
           b: {op: sw, rs1: 13, rs2: 31, imm: 0}}
        - {a: {op: ld, rd: 31, rs1: 12, imm: 0},
           b: {op: sd, rs1: 13, rs2: 31, imm: 0}}
      rows:
        - {funct5: "immb[4:0]", rs2: "imma[4:0]", rs1: rs1a, rd: rs1b}
      notes:
        - >-
          Both offsets are width-scaled and unsigned; the loaded value is
          the chain temporary and is not encoded.
  - frame:
      name: addi-store-off-chain
      does: "Compute a value from one base and store it at an offset from another."
      # The offset-bearing sibling of addi-store-chain, which pins the store at
      # offset zero to buy its addi a 10-bit immediate.  Both cannot be one
      # frame: that row is full at 20 bits (rs1a + imma[9:0] + rbase), so
      # carrying an offset means giving the addi immediate back.
      #
      # Sized on the FULL adjacency population, not the solo residue -- the
      # residue is selected for NOT fitting and reports a "7-bit cliff" that
      # does not exist (see FINDINGS.md).  Chained addi->store sites, coverage
      # by width, over cpp-rv32 / musl-rv32 / sqlite-rv64 (4379/1112/2436):
      #
      #   imma 5b + immb 5b   58.6% / 34.2% / 43.0%    4 codepoints
      #   imma 6b + immb 5b   69.3% / 36.2% / 45.4%    8
      #   imma 6b + immb 6b   70.0% / 36.9% / 70.2%   16   <- chosen
      #   imma 8b + immb 5b   86.5% / 40.8% / 50.9%   32
      #
      # The sixth OFFSET bit is what sqlite-rv64 needs (45% -> 70%): its
      # stores scale by eight, so the same byte offsets need one bit more.
      # Both sixth bits ride the opcode list, as the row draws five each.
      budget: 16
      level: 2
      templates:
        - ["addi    tmp, rs1a, imma", "store   tmp, k*immb(rbase)"]
      ops:
        - a: [{op: addi, imm: {bits: 6, signed: true}}]
          b: [{op: sb, imm: &aso6 {bits: 6, signed: false}}, {op: sh, imm: *aso6},
              {op: sw, imm: *aso6}, {op: sd, imm: *aso6}]
      probe:
        - {a: {op: addi, rd: 31, rs1: 12, imm: 8},
           b: {op: sw, rs1: 13, rs2: 31, imm: 4}}
      rows:
        - {funct5: rs1a, rs2: "immb[4:0]", rs1: rbase, rd: "imma[4:0]"}
      notes:
        - >-
          `immb` is width-scaled and unsigned; `imma` is signed.  The stored
          value is the chain temporary and is not encoded.
  - frame:
      name: load-call-chain
      does: "Load a function pointer and call through it (virtual dispatch)."
      # C++ virtual dispatch: load the vtable slot, then call it.  The loaded
      # pointer is the chain temporary -- it feeds the call and dies there --
      # so the frame encodes only the base register and the offset, leaving
      # most of the operand budget unused.
      #
      # This shape was previously believed absent.  FINDINGS.md recorded
      # "jalr writing ra occurs 0 times ... even C++ virtual dispatch produced
      # none", which was a census matching the explicit `jalr ra, rs, 0`
      # spelling the disassembler never emits; the corpus writes the
      # one-operand pseudo-op `jalr rs`.  cpp-rv32 has 2246 of them, 458 in
      # this exact adjacency, and 100% of those offsets fit the 6-bit scaled
      # field.
      #
      # No target is encoded -- it is read from a register -- so the direct
      # call's unencodable-displacement problem does not arise, and the link
      # value needs no field either: the link is `packet + 4` and WHICH
      # register receives it is an op choice, not an operand.
      #
      # TWO LINK REGISTERS, and only one of them is a call.  RISC-V names x1
      # and x5 as link registers -- a `jalr` writing either pushes the
      # return-address stack -- so x5 was admitted here on that reading.  It
      # never occurs: zero t0-linked jal/jalr across all 21 corpora, and no
      # `__riscv_save_*` millicode to produce any.  x6 (t1) does occur, and is
      # the more useful spelling: a PLT stub transfers with `jalr t1, rs`
      # precisely BECAUSE t1 is not a link register, so the stub neither
      # clobbers the caller's `ra` nor unbalances the return-address stack.
      # This frame therefore offers ra (a call) and t1 (a linking jump), and
      # not t0.  The two are distinguished by the op-select, which is what the
      # budget doubles to pay for -- there is no rd field to put them in.
      #
      # Contrast setup-jump-pair, which is the INDEPENDENT case (A's result is
      # not B's target -- argument marshalling).  It must field rda, rs1a and
      # rs1b, so its load row is full at 20 bits and its offset can never
      # exceed five.  Here A's result IS B's target, so neither is encoded and
      # the whole word is free for the base and offset: ten bits, costing
      # nothing, since idle operand bits are not codepoints.  (Beware: pricing
      # would report a 6-bit offset as free for setup-jump-pair too, because
      # imm_field_bits takes the WIDEST row and that frame's `li` row draws
      # ten -- but no load row could hold it.  TODO A8's row-versus-op
      # residue.)
      budget: 4
      level: 2
      # DECLARED OPTIMISM (ACCOUNTING.md sec 8).  This frame accepts an A whose
      # base came from an `auipc` -- the load half of a pc-relative address
      # materialisation, whose offset is a `%pcrel_lo` relocation.  Everywhere
      # else such a load is refused, because the corpus number is not a
      # displacement the program chose: it is `(target - pc_of_auipc) & 0xfff`,
      # an artifact of the layout that binary was linked for.  Repack the
      # binary and every one of those numbers changes.
      #
      # That is the reason to ADMIT it here rather than to refuse it.  The
      # value is not read from the corpus at all; it is whatever the link step
      # computes for the packed layout, and the only question is whether the
      # field can hold it.  A pcrel-lo spans 4096 bytes, and this frame's field
      # is ten bits scaled by the access width -- 4096 on rv32, 8192 on rv64 --
      # so it holds any value the split can produce.  Encodable by construction,
      # which is why nothing is range-checked on this path.
      #
      # Two things this does NOT wave away, both stated rather than assumed:
      #   * It presumes the packet ISA's own `auipc` uses an UNBIASED split
      #     (`lo = (target-pc) & 0xfff`, zero-extended).  Base RISC-V's +0x800
      #     bias exists only because its I-type immediate is sign-extended;
      #     this field is declared unsigned, so the bias would be wrong here.
      #     Measured on the corpus stubs, an unbiased split puts 100% of
      #     cpp-rv32 and cpp-rv64 in range against 50.1% / 48.5% as linked.
      #   * On rv64 the field scales by eight, so a pcrel-lo that is not
      #     8-aligned cannot be drawn.  cpp-rv64's 2487 are all 8-aligned
      #     (16-byte stubs against 8-byte GOT slots); sqlite-rv64 has 6 of 82
      #     at lo mod 8 in {2,4,6}.  So this is ~0-7% optimistic on rv64 and
      #     exact on rv32.  Scaling the `ld` row by four instead would close it
      #     at the cost of halving the reach for the vtable population.
      accepts_pcrel_lo: true
      templates:
        - ["load    tmp, k*imma(rs1a)", "jalr_link_ra tmp"]
        - ["load    tmp, k*imma(rs1a)", "jalr_link_t1 tmp"]
      ops:
        - {a: [{op: lw, imm: {bits: 10, signed: false}},
               {op: ld, imm: {bits: 10, signed: false}}],
           b: [jalr_link_ra, jalr_link_t1]}
      probe:
        - {a: {op: lw, rd: 31, rs1: 12, imm: 0},
           b: {op: jalr, rd: 1, rs1: 31, imm: 0}}
        - {a: {op: lw, rd: 31, rs1: 12, imm: 0},
           b: {op: jalr, rd: 6, rs1: 31, imm: 0}}
      rows:
        - {funct5: "imma[9:5]", rs2: "imma[4:0]", rs1: rs1a, rd: "unused"}
      notes:
        - >-
          `rd: unused` leaves the selecting sentinel to the enumerator, which
          allocates it from the reserved x0/x2 pool per (host, sentinel) --
          both patterns are reserved either way, so whichever has room
          carries this frame.
        - >-
          The link register is NOT drawn -- both templates share one row and
          are told apart by the op-select, which is why the budget is 4 for
          two loads rather than 2.  `rules.py` reads the permitted set from
          the `b` op list above (each op's `encode.rd`), so a register that
          is not spelled here cannot be paired by the scheduler either.
  - frame:
      name: arg-call-pair
      does: "Set up an argument, then call through a hard-coded base register."
      # The call frame, written so it can be MEASURED on code that exists.
      #
      # A direct call's displacement does not fit a packet, so today every call
      # in the corpus is a solo and the instruction beside it is a second solo.
      # This frame makes the transfer ten bits by hard-coding both registers:
      # `jalr ra, 4*immb(ra)` names neither its base nor its link, and
      # `jr 4*immb(t1)` names neither its base nor x0.  Targets are packet
      # aligned in this ISA, so the displacement is scaled by four and the low
      # two bits are dead -- 10 bits reaches +-2 KiB, which is what the high
      # half (`auipc`/`adduipc`) leaves unresolved.
      #
      # The register choice is not free.  A far CALL may use ra as its address
      # temporary because the jalr overwrites it with the link anyway, and the
      # corpus already does: 2462 of 2463 on cpp-rv32.  A far TAIL call may
      # NOT -- the auipc would destroy the return address the callee still
      # needs -- so it uses t1, and the corpus already does that too (101 on
      # cpp-rv32, 125 on godot).  Both spellings are hard-coded here rather
      # than fielded, which is where the ten bits come from.
      #
      # WHAT THIS FRAME LEAVES ON THE TABLE.  The high half is a 20-bit
      # instruction that can never pair -- it fills the operand space by
      # itself, so it stands as a solo word beside every packet this frame
      # makes.  A table jump (`cm.jalt`/`cm.jt`, Zcmt) removes it outright: the
      # index IS the target, so there is no high half to set up.  That is worth
      # one more word per call, on top of the word this frame saves, and it
      # needs no pairing opportunity at all -- an unpaired table jump still
      # fits a packet beside a derived nop.  Converting this frame is a
      # one-line change to its B ops; the A rows, the ten-bit field and the
      # budget are all unchanged, because a 10-bit index and a 10-bit scaled
      # displacement are the same shape.  See results/corpus/FINDINGS.md,
      # "The indexed-call frame, priced end to end".
      #
      # A ops are fitted in FINDINGS, "The indexed-call A slot, chosen from
      # what is REACHABLE": eight shapes reaching 66.9 / 57.1 / 60.9% of calls
      # on cpp / musl-gcc / sqlite rv32, against a hard ceiling of ~68 / 58 /
      # 62% (the share of calls with ANY movable candidate beside them).
      budget: 16
      level: 2
      templates:
        - ["mv      rda, rs1a",         "jalr_ra 4*immb"]
        - ["li      rda, imma",         "jalr_ra 4*immb"]
        - ["addi4spn rda, 4*imma",      "jalr_ra 4*immb"]
        - ["load    rda, k*imma(x2)",   "jalr_ra 4*immb"]
        - ["store   rs2a, k*imma(x2)",  "jalr_ra 4*immb"]
        - ["addi_rsd rda, imma",        "jr_t1   4*immb"]
      ops:
        - a: [mv, {op: li, imm: {bits: 7}}, {op: addi4spn, imm: {bits: 7, scale: 4, signed: false}},
              {op: lw, imm: {bits: 7, signed: false}},
              {op: ld, imm: {bits: 7, signed: false}},
              {op: sw, imm: {bits: 5, signed: false}},
              {op: sd, imm: {bits: 5, signed: false}},
              addi_rsd]
          b: [{op: jalr_ra, imm: {bits: 10, scale: 4}},
              {op: jr_t1,   imm: {bits: 10, scale: 4}}]
      measures_also: {a: [addiw]}
      probe:
        - {a: {op: addi, rd: 10, rs1: 8, imm: 0},
           b: {op: jalr, rd: 1, rs1: 1, imm: 16}}
        - {a: {op: addi, rd: 10, rs1: 0, imm: 0},
           b: {op: jalr, rd: 1, rs1: 1, imm: 16}}
        - {a: {op: addi, rd: 10, rs1: 2, imm: 8},
           b: {op: jalr, rd: 1, rs1: 1, imm: 16}}
        - {a: {op: addi, rd: 10, rs1: 10, imm: 4},
           b: {op: jalr, rd: 1, rs1: 1, imm: 16}}
        - {a: {op: lw, rd: 10, rs1: 2, imm: 4},
           b: {op: jalr, rd: 1, rs1: 1, imm: 16}}
        - {a: {op: ld, rd: 10, rs1: 2, imm: 8},
           b: {op: jalr, rd: 1, rs1: 1, imm: 16}}
        - {a: {op: sw, rs2: 10, rs1: 2, imm: 4},
           b: {op: jalr, rd: 1, rs1: 1, imm: 16}}
        - {a: {op: sd, rs2: 10, rs1: 2, imm: 8},
           b: {op: jalr, rd: 1, rs1: 1, imm: 16}}
        - {a: {op: addi, rd: 10, rs1: 8, imm: 0},
           b: {op: jalr, rd: 0, rs1: 6, imm: 16}}
      rows:
        - {funct5: rs1a, rs2: "immb[4:0]", rs1: "immb[9:5]", rd: rda}
        - funct5: "imma[4:0]"
          rs2: "immb[4:0]"
          rs1: "immb[9:5]"
          rd:
            - {bits: 2, value: "imma[6:5]"}
            - {bits: 3, value: rda}
        - {funct5: "imma[4:0]", rs2: "immb[4:0]", rs1: "immb[9:5]", rd: rs2a}
      notes:
        - >-
          Row 1 holds `mv`, which needs only rs1a and rda; row 2 holds the
          three ops that want a wide immediate and an ARGUMENT destination,
          splitting the rd column three-two so `imma` reaches seven bits;
          row 3 holds the stores, whose source register needs all five bits
          and whose stack offsets are small.
        - >-
          rd 3 bits costs almost nothing here and buys two: `li` at rd3+imm5
          catches 925 of the 933 that an unrestricted rd catches on cpp-
          rv32, because these are argument setups by construction.  3+7
          beats 5+5 by 68% on cpp `li` and 18% on cpp `addi4spn`.
        - >-
          Load and store offsets scale by the ACCESS width, as `c.lwsp` and
          `c.sdsp` do: spill slots are aligned to the access, so `k*imm`
          costs nothing and reaches four or eight times further.
        - >-
          `addi4spn` scales by four, which is a real trade rather than a
          free one: 10.7% of cpp's `addi rd,sp` are NOT 4-aligned, because
          C++ takes the address of byte- and short-sized stack temporaries,
          so scaling costs 13% of the cpp hits (6473 against 7456 for a raw
          7-bit field) and buys 0..508 instead of 0..127.  On rv64 the
          scaled form is the one the fit prefers outright.
        - >-
          The rd column is a register in row 1 only, so this frame neither
          hosts nor is hosted.
  - frame:
      name: macro-op-pair
      does: "Both halves of ONE computation over the same operands (mul/mulh, div/rem), declared as a pair so an implementation can fuse them."
      budget: 16
      level: 1
      templates:
        - ["alu     rda, rs1a, rs2a", "alu     rdb, rs1a, rs2a"]
      ops:
        - {a: [add],    b: [sub]}
        - {a: [addw],   b: [subw]}
        - {a: [min],    b: [max]}
        - {a: [minu],   b: [maxu]}
        - {a: [mulh, mulhu, mulhsu], b: [mul]}
        - {a: [div],    b: [rem]}
        - {a: [divu],   b: [remu]}
        - {a: [divw],   b: [remw]}
        - {a: [divuw],  b: [remuw]}
      rows:
        - {funct5: rda, rs2: rs2a, rs1: rs1a, rd: rdb}
      notes:
        - >-
          KEPT DELIBERATELY DESPITE A NEAR-ZERO SCORE. Do not cut this frame
          on pairing-rate evidence; it is not here to earn pairs.
        - >-
          Every cluster is two halves of ONE computation over the same
          operands: the low and high words of a multiply, the quotient and
          remainder of a divide, the sum and difference, the min and the
          max. Encoding them as a declared pair tells the implementation
          both results are wanted, so it can FUSE -- one pass of the
          multiplier or divider producing both halves -- instead of issuing
          the operation twice and discarding half of each result. That is a
          hardware invitation, and it is worth a codepoint block whether or
          not today's compilers accept it.
        - >-
          They mostly do not, yet. Measured over four corpora: 70 scheduled
          pairs. The ceiling is no higher -- adjacent tuple matches with
          positionally shared operands number 31 on musl-rv32, 25 on cpp-
          rv32, 2 on sqlite-gcc-rv64, 0 on sqlite-rv64 -- so nothing is
          suppressing it. Notably the frame is NOT register-window
          constrained: rules.py carries no x0-x15 set, and this row draws
          four full 5-bit fields.
        - >-
          ORDER IS NOT ARBITRARY, and it is not a dependency either. The two
          ops read the same two sources and neither consumes the other's
          result, so they commute -- but the RISC-V M extension names one
          sequence as THE fusion idiom, and a microarchitecture told to
          detect fusable pairs is looking for that one: MULH[[S]U] rdh, rs1,
          rs2 ; MUL rdl, rs1, rs2 DIV[U]     rdq, rs1, rs2 ; REM[U] rdr,
          rs1, rs2 high half first, quotient first, "source register
          specifiers must be in the same order and rdh cannot be the same as
          rs1 or rs2" -- that last clause because the fused unit still needs
          both sources intact when it delivers the second result.
          `_reject_dependence` already enforces exactly that (`a.rd not in
          b.uses_regs`), so rules.py gets it for free.
        - >-
          The clusters are listed in the spec's sequence and the compiler
          already emits it (hi-first outnumbers lo-first 22:9 on musl-rv32,
          div-first is universal, and every measured occurrence satisfies
          the rdh-not-a-source rule). rules.py canonicalises, so both
          directions still pair; the canonical direction also gets the
          lighter dependence test, so keep it spec-ordered.
        - >-
          The gap is a toolchain one -- a compiler that knew this pairing
          were available would emit the two halves adjacently and in order.
          Treat the low score as a measurement of clang and GCC, not of the
          frame.
  - frame:
      name: dual-setup-pair
      does: "Two independent small moves or constants -- argument marshalling."
      # `li` is 6 bits: a 5-bit field plus one opcode repeat (the *li_6s
      # anchor), charged in both slots -- demand 11 -> 17, a 32-block, +169
      # pairs at ~10.6/codepoint.  Worth it only while the space is idle.
      # 7 bits would double the charge again (demand 23); not taken.
      #
      # Only ONE of the pair may be wide: row 2 draws immb for B but imma[4:0]
      # for A. Not a real loss -- pairs with two wide immediates are rare, and
      # since this frame already requires mutual independence the encoder may
      # put whichever one is wide into the immb field, so rules.py accepts it
      # in either slot.
      #
      # 11 codepoints: the triangle over li, mv, addi4spn_u6, where the last
      # weighs 2 (a 6-bit range over a 5-bit base field). That is 11 rather than
      # the ideal 10 because the triangle orders the OPCODES but has no syntax
      # to order two immediates of the SAME op, so the addi4spn/addi4spn
      # diagonal pays 2x2 where 2x3/2 would do. Deliberately left alone: 10 and
      # 11 both reserve the same 16-codepoint block, so the difference is a
      # don't-care until the frame grows past 16. See the `ops` header note.
      budget: 32
      level: 1
      templates:
        - ["mv      rda, rs1a", "mv/li   rdb, rs2b/immb"]
        - ["li      rda, imma", "li      rdb, immb"]
      # Order-insensitive: the two ops are independent, so (x, y) and (y, x)
      # compute the same thing and only ONE needs a codepoint. Written longhand
      # as a triangle in the canonical order mv < li < addi4spn -- the scheduler
      # normalises a pair into that order before encoding. A full cross product
      # here would be the bug it replaced: 3x3 = 9 codepoints to express 6
      # distinct packets. See the `ops` note in the header.
      #
      # The canonical order is NOT arbitrary: it must put register-form ops
      # first. The only row that gives A an immediate (imma[4:0]) also gives B
      # one, and there is no row pairing imma for A with rs2b for B -- so if A
      # takes an immediate, B must too. Ordering mv (register) ahead of li and
      # addi4spn (immediate) makes every cluster below land on a real row:
      # (mv,mv) row 0, (mv,li) and (mv,addi4spn) row 1, the rest row 2. The
      # earlier li-first order had it exactly backwards, admitting (li, mv),
      # which no row can encode, and excluding (mv, li), which row 1 encodes.
      ops:
        - {a: [mv],  b: [mv, *li_6s, *addi4spn_u6]}
        - {a: [*li_6s], b: [*li_6s, *addi4spn_u6]}
        - {a: [*addi4spn_u6],  b: [*addi4spn_u6]}
      rows:
        - {funct5: rda, rs2: rs2b, rs1: rs1a, rd: rdb}
        - {funct5: rda, rs2: "immb[4:0]", rs1: rs1a, rd: rdb}
        - {funct5: rda, rs2: "immb[4:0]", rs1: "imma[4:0]", rd: rdb}

  - frame:
      name: rsd-alu-pair
      does: "Two in-place ALU updates, each rewriting its own source register."
      budget: 256
      level: 2
      templates:
        - ["alu rsda, rsda, rs2a/imma", "alu rsdb, rsdb, rs2b/immb"]
      ops:
        - {a: *rsd_alu, b: *rsd_alu}
      rows:
        - {funct5: rs2b, rs2: rs2a, rs1: rsda, rd: rsdb}
        - {funct5: rs2b, rs2: "imma[4:0]", rs1: rsda, rd: rsdb}
        - {funct5: "immb[4:0]", rs2: rs2a, rs1: rsda, rd: rsdb}
        - {funct5: "immb[4:0]", rs2: "imma[4:0]", rs1: rsda, rd: rsdb}
      notes:
        - >-
          The four register operands occupy the four 5-bit columns -- 20
          bits, the whole operand budget -- so registers here are a FULL
          5-bit field, x0..x31. An earlier note anticipated cutting them to
          4 bits; that is not needed, and scheduler/rules.py enforcing
          x0..x15 was costing 377 pairs across the corpus.
  - frame:
      name: prologue-pair
      does: "Function prologue: reserve the stack frame and save the return address."
      budget: 2
      level: 2
      templates:
        - ["addi    sp, -16*imm", "store   rs1b, 16*imm-k(sp)"]
      ops:
        - {a: [addi], b: [sw, sd]}
      rows:
        - {funct5: rs1b, rs2: "imm[4:0]", rs1: "imm[9:5]", rd: "unused"}

  - frame:
      name: epilogue-pair
      does: "Function epilogue: release the stack frame and return."
      budget: 2
      level: 2
      templates:
        - ["addi    sp, 16*imm", "jr      rs1b"]
      ops:
        - {a: [addi], b: [jalr, ret]}
      rows:
        - {funct5: rs1b, rs2: "imm[4:0]", rs1: "imm[9:5]", rd: "unused"}

  - frame:
      name: arith-jump-pair
      does: "A last in-place computation, then a control transfer."
      budget: 64
      level: 2
      templates:
        - ["alu     rsda, rsda, rs2a/imma", "jr/jalr rs1b"]
        - ["mv     rsda, rs2a", "jr/jalr rs1b"]
        - ["li     rsda, imma", "jr/jalr rs1b"]
      ops:
        - {a: *rsd_alu_j, b: [ret, jalr, j, jal]}
      rows:
        - {funct5: rs1b, rs2: rs2a, rs1: rsda, rd: "unused"}
        - {funct5: rs1b, rs2: "imma[4:0]", rs1: rsda, rd: "unused"}

  - frame:
      name: setup-jump-pair
      does: "Set up an argument or return value, then transfer control."
      # Set up a value, then transfer control. The counterpart to
      # arith-jump-pair: that frame's A slot is RSD (rd == rs1), so its rd field
      # is free for the sentinel. Here A's destination and source are DISTINCT
      # registers -- `mv a0, a5` before a tail call -- which needs two register
      # fields and so cannot fit there.
      #
      # 936 pairs across 742 functions, top contributor 3.2%: the argument-setup
      # idiom before a tail call or return. By A form: mv 599, li 191, load 146.
      # The mv destination is an ABI argument register 92% of the time (a0 60%)
      # and the jump NEVER reads it -- this is argument setup, not a chain.
      #
      # mv and the loads share one row: `mv rda, rs1a` is the load row with the
      # offset field ignored, which the opcode already distinguishes. li takes
      # its own row because its 10-bit immediate spans rs2+rs1.
      #
      # Load offsets are effectively always zero here (98.2% of the chained
      # cases, measured without the current rule's 2-bit filter), so imma[4:0]
      # is generous. That figure is one corpus idiom though -- 54 of 55 are the
      # same frame-pointer spill in RV32 -- so it is sized for a real vtable
      # dispatch that this corpus happens not to contain.
      budget: 16
      level: 2
      templates:
        - ["mv      rda, rs1a", "jr      rs1b"]
        - ["load    rda, k*imma(rs1a)", "jr      rs1b"]
        - ["li      rda, imma", "jr      rs1b"]
        - ["mv      rda, rs1a", "j       4*immb"]
        - ["load    rda, 0(rs1a)", "j       4*immb"]
        - ["li      rda, imma", "j       4*immb"]
      ops:
        - {a: [mv, lbu, lw, ld], b: [ret, jalr]}
        - {a: [li], b: [ret, jalr]}
        - {a: [mv, lbu, lw, ld], b: [{op: j, imm: {bits: 10, signed: true, scale: 4}}]}
        - {a: [li], b: [j]}
      rows:
        - {funct5: rs1b, rs2: "imma[4:0]", rs1: rs1a, rd: rda}
        - {funct5: rs1b, rs2: "imma[4:0]", rs1: "imma[9:5]", rd: rda}
        - {funct5: rs1a, rs2: "immb[4:0]", rs1: "immb[9:5]", rd: rda}
        - {funct5: "imma[4:0]", rs2: "immb[4:0]", rs1: "immb[9:5]", rd: rda}
      notes:
        - >-
          `j` covers `jal x0`; a jal with a real destination is a call and
          is excluded from every jump frame.
        - >-
          Direct `j` (78-92% of this frame's packets) takes rows 3-4: `rs1b`
          is dropped -- a direct jump has no register operand -- and `immb`
          gets the rs2+rs1 span, a 10-bit displacement in PACKET units.
          Packets are 4-byte aligned, so the low bit RVC must carry is dead
          and a displacement costs 0.54x its RVC bits. 10 bits covers 84.6%
          of direct `j` on sqlite and 97-98% on musl.
        - >-
          rules.py cannot range-check the displacement: corpus jump operands
          are unresolved labels, so a pairwise rule has nothing to test. The
          scheduled count includes the over-range tail (~15% on sqlite). See
          results/corpus/README.md.
        - >-
          On the direct-`j` rows a load has no offset field (offsets are
          zero in 98.2% of chained cases anyway) and `li` narrows to 5 bits.